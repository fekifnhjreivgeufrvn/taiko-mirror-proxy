<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Taiko Gameplay</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Kaisei+Decol:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500;600&display=swap');

  :root {
    --bg0: #0a0c12;
    --bg1: #12151d;
    --bg2: #1a1e2a;
    --bg3: #232838;
    --bg4: #2c3247;
    --line: #2a2f42;
    --text: #d9dce6;
    --text-dim: #767c94;
    --text-bright: #f4f5f9;
    --don: #e8493a;
    --don-glow: rgba(232,73,58,0.45);
    --kat: #3fb6cf;
    --kat-glow: rgba(63,182,207,0.45);
    --accent: #e8c14a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Zen Kaku Gothic New', 'Segoe UI', sans-serif;
    background:
      radial-gradient(1200px 700px at 15% -10%, rgba(63,182,207,0.07), transparent 60%),
      radial-gradient(1200px 700px at 90% 110%, rgba(232,73,58,0.07), transparent 60%),
      var(--bg0);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
  }

  /* ── Single persistent app shell — nothing here ever navigates away,
     it only swaps small pieces of content in place. ───────────────── */
  #app {
    width: 100%;
    max-width: 1080px;
    height: 100%;
    padding: 16px 18px 18px;
    display: grid;
    grid-template-rows: auto 1fr auto;
    gap: 12px;
    min-height: 0;
  }

  /* ── Stage ─────────────────────────────────────────────────────── */
  #stage-wrap {
    grid-row: 2;
    position: relative;
    border-radius: 16px;
    overflow: hidden;
    border: 1px solid var(--line);
    background: #05070b;
    min-height: 0;
  }
  /* The actual game view (background art + note canvas) is locked to a
     16:9 box and letterboxed within #stage-wrap by JS (see syncCanvasSize).
     osu!taiko's own storyboard coordinate space (VIEW.x0..x1, 854px wide)
     assumes a 16:9 viewport, so if this box were allowed to stretch to
     whatever aspect ratio the container happens to have, note spacing on
     the X axis and note size on the Y axis stop agreeing with each other
     and notes read as too close together (or too far apart). Locking the
     aspect ratio here is what keeps spacing faithful to the real game. */
  #stage-inner {
    position: absolute; /* left/top/width/height are set in JS */
    overflow: hidden;
  }
  #stage-bg {
    position: absolute; inset: 0;
    background-size: cover; background-position: center;
    transform: scale(1.15);
    /* No CSS filter here on purpose — a live blur filter's compositing cost
       scales with on-screen area and gets re-paid every time the canvas
       above it repaints. The blur is baked into a tiny bitmap once in JS
       instead (see bakeBlurredBackground), so this layer is a plain,
       cheap-to-composite static image. */
  }
  #stage-bg::after { content: ''; position: absolute; inset: 0; background: rgba(5,7,11,0.45); }
  #playfield { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }

  #kiai-tag {
    position: absolute; top: 10px; left: 12px; z-index: 5;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.63rem; letter-spacing: 0.08em;
    color: var(--accent); background: rgba(232,193,74,0.14);
    border: 1px solid rgba(232,193,74,0.35);
    padding: 3px 9px; border-radius: 999px;
    opacity: 0; transition: opacity 0.2s ease;
    pointer-events: none;
  }
  #kiai-tag.show { opacity: 1; }

  #loading-overlay {
    position: absolute; inset: 0; z-index: 10;
    display: none; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
    background: rgba(5,7,11,0.82);
  }
  #loading-overlay.show { display: flex; }
  #loading-overlay .spinner {
    width: 34px; height: 34px; border-radius: 50%;
    border: 3px solid var(--line); border-top-color: var(--kat);
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loading-overlay .msg { font-size: 0.78rem; color: var(--text-dim); }

  /* .tbtn is reused by the pause/results overlays, kept even though the
     transport bar that originally used it is gone. */
  .tbtn {
    background: var(--bg3); border: 1px solid var(--line); color: var(--text-bright);
    cursor: pointer; border-radius: 10px; padding: 8px 11px;
    display: flex; align-items: center; justify-content: center; font-size: 0.88rem;
    transition: background 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
  }
  .tbtn:hover { background: var(--bg2); border-color: var(--accent); }
  .tbtn:active { transform: scale(0.94); }

  ::selection { background: rgba(232,193,74,0.35); }

  /* Hide any lingering chrome while actually playing — the stage (1fr row)
     naturally expands to fill the freed space since this row collapses. */
  #app.testing #controls { display: none; }

  #test-hud {
    position: absolute; top: 10px; left: 12px; right: 12px; z-index: 7;
    display: none;
    align-items: flex-start; justify-content: space-between;
    pointer-events: none;
  }
  #app.testing #test-hud { display: flex; }
  #test-hud-stats { display: flex; flex-direction: column; gap: 2px; }
  #test-combo { display: flex; align-items: baseline; gap: 6px; }
  #test-combo-n { font-family: 'JetBrains Mono', monospace; font-size: 1.6rem; font-weight: 700; color: var(--text-bright); text-shadow: 0 2px 8px rgba(0,0,0,0.6); }
  #test-combo .unit { font-size: 0.68rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.05em; }
  #test-acc { font-family: 'JetBrains Mono', monospace; font-size: 0.78rem; color: var(--text-dim); text-shadow: 0 2px 6px rgba(0,0,0,0.6); }
  #btn-test-exit {
    pointer-events: auto;
    width: 32px; height: 32px; border-radius: 50%;
    background: rgba(10,12,18,0.6); border: 1px solid var(--line); color: var(--text-bright);
    font-size: 0.85rem; cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  #btn-test-exit:hover { border-color: var(--don); background: rgba(232,73,58,0.15); }

  #test-skip-btn {
    position: absolute; right: 14px; bottom: 16px; z-index: 7;
    display: none; align-items: center; gap: 6px;
    padding: 9px 16px; border-radius: 999px;
    background: rgba(10,12,18,0.7); border: 1px solid var(--line); color: var(--text-bright);
    font-family: 'Zen Kaku Gothic New', sans-serif; font-weight: 700; font-size: 0.78rem;
    cursor: pointer; pointer-events: auto;
    transition: border-color 0.15s, background 0.15s, transform 0.1s;
  }
  #test-skip-btn.show { display: none; }
  #app.testing #test-skip-btn.show { display: flex; }
  #test-skip-btn:hover { border-color: var(--accent); background: rgba(232,193,74,0.15); }
  #test-skip-btn:active { transform: scale(0.95); }

  #test-touch-zones {
    position: absolute; inset: 0; z-index: 6;
    display: none;
    grid-template-columns: repeat(4, 1fr);
  }
  #app.testing #test-touch-zones { display: grid; }
  .drum-zone {
    border: none; outline: none; -webkit-tap-highlight-color: transparent;
    touch-action: none;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Zen Kaku Gothic New', sans-serif; font-weight: 700; font-size: 0.7rem;
    letter-spacing: 0.04em; color: rgba(255,255,255,0.28);
    background: transparent; cursor: pointer; user-select: none;
    transition: background 0.08s ease;
  }
  .drum-zone.kat { border-left: 1px solid rgba(255,255,255,0.05); border-right: 1px solid rgba(255,255,255,0.05); }
  .drum-zone.kat:active, .drum-zone.kat.pressed { background: rgba(63,182,207,0.22); }
  .drum-zone.don:active, .drum-zone.don.pressed { background: rgba(232,73,58,0.22); }
  .drum-zone { flex-direction: column; gap: 4px; }
  .drum-zone .key-hint {
    font-family: 'JetBrains Mono', monospace; font-size: 0.62rem; font-weight: 600;
    color: rgba(255,255,255,0.4);
    border: 1px solid rgba(255,255,255,0.18); border-radius: 4px;
    padding: 1px 6px;
  }

  #test-results {
    position: absolute; inset: 0; z-index: 15;
    display: none;
    align-items: center; justify-content: center;
    background: rgba(5,7,11,0.86);
  }
  #test-results.show { display: flex; }
  #test-results .panel {
    background: linear-gradient(180deg, var(--bg1), var(--bg2));
    border: 1px solid var(--line); border-radius: 16px;
    padding: 26px 30px; text-align: center; min-width: 280px;
  }
  #test-results h2 { font-size: 1.1rem; color: var(--text-bright); margin-bottom: 10px; }
  #test-results .acc-big { font-family: 'JetBrains Mono', monospace; font-size: 2.2rem; font-weight: 700; color: var(--accent); margin-bottom: 16px; }
  #test-results .res-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 20px; }
  #test-results .res-grid .n { display: block; font-family: 'JetBrains Mono', monospace; font-size: 1.05rem; font-weight: 700; color: var(--text-bright); }
  #test-results .res-grid .l { display: block; font-size: 0.62rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.04em; margin-top: 2px; }
  #test-results .res-actions { display: flex; gap: 10px; justify-content: center; }
  #test-results .res-actions .tbtn { padding: 9px 16px; }

  #test-pause {
    position: absolute; inset: 0; z-index: 16;
    display: none;
    align-items: center; justify-content: center;
    background: rgba(5,7,11,0.86);
  }
  #test-pause.show { display: flex; }
  #test-pause .panel {
    background: linear-gradient(180deg, var(--bg1), var(--bg2));
    border: 1px solid var(--line); border-radius: 16px;
    padding: 26px 30px; text-align: center; min-width: 260px;
  }
  #test-pause h2 { font-size: 1.1rem; color: var(--text-bright); margin-bottom: 18px; }
  #test-pause .res-actions { display: flex; flex-direction: column; gap: 10px; }
  #test-pause .res-actions .tbtn { padding: 10px 18px; }

  @media (max-width: 640px) {
    #app { padding: 10px 10px 12px; gap: 8px; }
  }
</style>
</head>
<body>

<div id="app">
  <div id="stage-wrap">
    <div id="stage-inner">
      <div id="stage-bg"></div>
      <canvas id="playfield"></canvas>
      <div id="kiai-tag">KIAI</div>
    </div>

    <div id="loading-overlay">
      <div class="spinner"></div>
      <div class="msg" id="loading-msg">Downloading and reading map…</div>
    </div>

    <!-- ── Test Play HUD — only visible while actually playing the map ── -->
    <div id="test-hud">
      <div id="test-hud-stats">
        <div id="test-combo"><span id="test-combo-n">0</span><span class="unit">combo</span></div>
        <div id="test-acc">100.00%</div>
      </div>
      <button id="btn-test-exit" type="button" title="Pause (Esc)">⏸</button>
    </div>

    <button id="test-skip-btn" type="button">Skip ⏩</button>

    <div id="test-touch-zones">
      <button class="drum-zone kat" data-code="KeyD">かKAT<span class="key-hint">D</span></button>
      <button class="drum-zone don" data-code="KeyF">ドDON<span class="key-hint">F</span></button>
      <button class="drum-zone don" data-code="KeyJ">ドDON<span class="key-hint">J</span></button>
      <button class="drum-zone kat" data-code="KeyK">かKAT<span class="key-hint">K</span></button>
    </div>

    <div id="test-pause">
      <div class="panel">
        <h2>Paused</h2>
        <div class="res-actions">
          <button class="tbtn" id="btn-pause-continue" type="button">▶ Continue</button>
          <button class="tbtn" id="btn-pause-retry" type="button">↺ Retry</button>
          <button class="tbtn" id="btn-pause-quit" type="button">✕ Quit</button>
        </div>
      </div>
    </div>

    <div id="test-results">
      <div class="panel">
        <h2 id="test-results-title">Cleared!</h2>
        <div class="acc-big" id="res-acc">100.00%</div>
        <div class="res-grid">
          <div><span class="n" id="res-great">0</span><span class="l">Great</span></div>
          <div><span class="n" id="res-good">0</span><span class="l">Good</span></div>
          <div><span class="n" id="res-miss">0</span><span class="l">Miss</span></div>
          <div><span class="n" id="res-combo">0</span><span class="l">Max combo</span></div>
        </div>
        <div class="res-actions">
          <button class="tbtn" id="btn-test-retry" type="button">↺ Retry</button>
          <button class="tbtn" id="btn-test-back" type="button">✕ Quit</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>

//  Note textures, lane hit position, and scroll-speed (SV) math match

const HIT_X = 53;     // note hit position X, OSB space
const VIEW  = { x0: -107, x1: 747 }; // OSB horizontal range shown

const BASE_SPEED_PER_BPM = 245 / 60000 * 0.8;
function getBaseSpeedForBPM(bpm) { return BASE_SPEED_PER_BPM * (bpm || 120); }

const DON_RGB = [235, 74, 50];
const KAT_RGB = [74, 144, 173];

// ── .osu parsing ─────────────────────────────────────────────────────
function parseOSU(text) {
  const lines = text.replace(/\r/g, '').split('\n');
  const result = {
    audioFilename: 'audio.mp3',
    bpm: 140,
    firstBeat: 0,
    timingPoints: [],
    hitObjects: [],
    title: '', artist: '', creator: '', version: '',
    backgroundFile: '',
    svPoints: [],
    od: 5,
    mode: 0, // 0=osu std, 1=taiko, 2=ctb, 3=mania — maps predating this field are std
    audioLeadIn: 0,
  };
  let section = '';
  for (const raw of lines) {
    const line = raw.trim();
    if (!line || line.startsWith('//')) continue;
    if (line.startsWith('[')) { section = line.slice(1, -1).toLowerCase(); continue; }
    if (section === 'events') {
      const bgMatch = line.match(/^0,0,"?([^",]+)"?/);
      if (bgMatch) result.backgroundFile = bgMatch[1].trim();
    }
    if (section === 'general') {
      if (line.startsWith('AudioFilename:')) result.audioFilename = line.split(':').slice(1).join(':').trim();
      if (line.startsWith('Mode:')) { const m = parseInt(line.slice(5).trim(), 10); if (!isNaN(m)) result.mode = m; }
      if (line.startsWith('AudioLeadIn:')) { const v = parseInt(line.slice(12).trim(), 10); if (!isNaN(v)) result.audioLeadIn = v; }
    }
    if (section === 'difficulty') {
      if (line.startsWith('OverallDifficulty:')) {
        const v = parseFloat(line.slice(19).trim());
        if (!isNaN(v)) result.od = v;
      }
    }
    if (section === 'metadata') {
      if (line.startsWith('Title:') && !result.title) result.title = line.slice(6).trim();
      if (line.startsWith('TitleUnicode:')) result.title = line.slice(13).trim() || result.title;
      if (line.startsWith('Artist:') && !result.artist) result.artist = line.slice(7).trim();
      if (line.startsWith('ArtistUnicode:')) result.artist = line.slice(14).trim() || result.artist;
      if (line.startsWith('Creator:')) result.creator = line.slice(8).trim();
      if (line.startsWith('Version:')) result.version = line.slice(8).trim();
    }
    if (section === 'timingpoints') {
      const p = line.split(',');
      if (p.length < 2) continue;
      const uninherited = p.length > 6 ? parseInt(p[6]) === 1 : true;
      const effects = p.length > 7 ? (parseInt(p[7]) || 0) : 0;
      const isKiai = (effects & 1) !== 0;
      const tp = { time: parseFloat(p[0]), beatLength: parseFloat(p[1]), uninherited, isKiai };
      if (isNaN(tp.time) || isNaN(tp.beatLength)) continue;
      result.timingPoints.push(tp);
      if (uninherited && tp.beatLength > 0) {
        if (result.firstBeat === 0 || tp.time < result.firstBeat) {
          result.firstBeat = tp.time;
          result.bpm = 60000 / tp.beatLength;
        }
      }
      if (!uninherited && tp.beatLength < 0) {
        result.svPoints.push({ time: Math.round(tp.time), sv: -100 / tp.beatLength });
      }
    }
    if (section === 'hitobjects') {
      const p = line.split(',');
      if (p.length < 5) continue;
      const hitSound = parseInt(p[4]) || 0;
      const isKat = (hitSound & 2) !== 0 || (hitSound & 8) !== 0;
      const isBig = (hitSound & 4) !== 0;
      const t = parseInt(p[2]);
      if (isNaN(t)) continue;
      result.hitObjects.push({ time: t, type: isKat ? (isBig ? 'bigkat' : 'kat') : (isBig ? 'bigdon' : 'don') });
    }
  }
  result.hitObjects.sort((a, b) => a.time - b.time);
  result.duration = result.hitObjects.length ? result.hitObjects[result.hitObjects.length - 1].time + 3000 : 10000;

  result.uninheritedPoints = result.timingPoints
    .filter(tp => tp.uninherited && tp.beatLength > 0)
    .map(tp => ({ time: tp.time, beatLength: tp.beatLength, bpm: 60000 / tp.beatLength }))
    .sort((a, b) => a.time - b.time);

  result.svPoints.sort((a, b) => a.time - b.time);
  if (result.svPoints.length === 0 || result.svPoints[0].time > (result.firstBeat || 0)) {
    result.svPoints.unshift({ time: result.firstBeat || 0, sv: 1.0 });
  }

  // kiai ranges — contiguous stretches where the active timing point has the kiai flag set
  result.kiaiRanges = [];
  {
    const pts = result.timingPoints.slice().sort((a, b) => a.time - b.time);
    let curStart = null;
    for (let i = 0; i < pts.length; i++) {
      if (pts[i].isKiai && curStart === null) curStart = pts[i].time;
      if (!pts[i].isKiai && curStart !== null) { result.kiaiRanges.push([curStart, pts[i].time]); curStart = null; }
    }
    if (curStart !== null) result.kiaiRanges.push([curStart, result.duration]);
  }

  return result;
}

// ── Physics: BPM / scroll-speed lookups by map time ───────────────────
function getBPMAt(mapData, t) {
  let bpm = mapData.bpm;
  for (const tp of mapData.uninheritedPoints) {
    if (tp.time <= t) bpm = tp.bpm; else break;
  }
  return bpm;
}
function getSVAt(mapData, t) {
  let sv = 1.0;
  for (const p of mapData.svPoints) {
    if (p.time <= t) sv = p.sv; else break;
  }
  return sv;
}
function getBeatSegmentAt(mapData, t) {
  const pts = mapData.uninheritedPoints;
  if (!pts.length) return { anchor: mapData.firstBeat || 0, beatDur: 60000 / mapData.bpm };
  let seg = pts[0];
  for (const p of pts) { if (p.time <= t) seg = p; else break; }
  return { anchor: seg.time, beatDur: seg.beatLength };
}
// x(hitTime, currentTime) — identical formula to the reference tool's fast path.
// Deliberately NOT clamped once currentTime passes hitTime: a note that
// wasn't hit needs to keep sliding past the hit line and off-screen, same
// as it would in the real game, instead of freezing in place.
function getNoteX(mapData, hitTime, currentTime) {
  const sv = getSVAt(mapData, hitTime);
  const bs = getBaseSpeedForBPM(getBPMAt(mapData, hitTime));
  return HIT_X + (hitTime - currentTime) * sv * bs;
}

function lowerBound(arr, t) {
  let lo = 0, hi = arr.length;
  while (lo < hi) {
    const mid = (lo + hi) >> 1;
    if (arr[mid].time < t) lo = mid + 1; else hi = mid;
  }
  return lo;
}

// ── Test Play hit windows ──────────────────────────────────────────
// Approximate osu!taiko-style judging scaled by Overall Difficulty. These
// are tuned to feel right for casual practice — not a byte-exact port of
// ranked osu!'s internal hit windows.
function greatWindowMs(od) { return 50 - 3 * (od == null ? 5 : od); }   // OD0: 50ms · OD10: 20ms
function goodWindowMs(od) {
  const o = od == null ? 5 : od;
  // Real osu!taiko's OK window is piecewise around OD5, not a flat line —
  // OD0: 120ms · OD5: 80ms · OD10: 50ms.
  return o <= 5 ? 120 - 8 * o : 110 - 6 * o;
}
function missWindowMs(od) {
  const o = od == null ? 5 : od;
  // The outer window: a press inside this range always resolves the locked
  // note (Great/Good if timed and coloured right, otherwise Miss) instead of
  // being ignored — OD0: 135ms · OD5: 95ms · OD10: 70ms, same piecewise shape.
  return o <= 5 ? 135 - 8 * o : 120 - 5 * o;
}

// ── Canvas / coordinate mapping ────────────────────────────────────────
const canvas = document.getElementById('playfield');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false; // note sprites are simple flat circles — skip the smoothing cost

let _bgGradient = null; // rebuilt only when canvas size changes, not every frame

function activeLaneCount() {
  return 1; // "all diffs" stacked view was preview-only tooling, removed — always single lane now
}

const STAGE_ASPECT = 16 / 9; // matches the VIEW OSB coordinate space (854 wide against a 480-tall field)
const stageInner = document.getElementById('stage-inner');

function syncCanvasSize() {
  const wrap = document.getElementById('stage-wrap');
  const rawDpr = window.devicePixelRatio || 1;
  const ww = wrap.clientWidth, wh = wrap.clientHeight;

  // Letterbox #stage-inner to a locked 16:9 box centered in #stage-wrap.
  // Without this, stage-inner (and the canvas filling it) would just take
  // on whatever aspect ratio the surrounding page layout happens to leave
  // available, which desyncs the X-axis note spacing (mapped from a fixed
  // 854-wide OSB space) from the Y-axis note size (derived from stage
  // height) — the note-packing issue this fixes.
  let iw, ih;
  if (ww / wh > STAGE_ASPECT) {
    ih = wh;
    iw = wh * STAGE_ASPECT;
  } else {
    iw = ww;
    ih = ww / STAGE_ASPECT;
  }
  iw = Math.max(1, Math.round(iw));
  ih = Math.max(1, Math.round(ih));
  const left = Math.round((ww - iw) / 2), top = Math.round((wh - ih) / 2);
  if (stageInner.style.width !== iw + 'px') stageInner.style.width = iw + 'px';
  if (stageInner.style.height !== ih + 'px') stageInner.style.height = ih + 'px';
  if (stageInner.style.left !== left + 'px') stageInner.style.left = left + 'px';
  if (stageInner.style.top !== top + 'px') stageInner.style.top = top + 'px';

  // More stacked lanes = more per-frame drawing, so scale resolution down as
  // lane count grows. This is what actually explains "fullscreen is choppy,
  // split-screen is smooth" — iPad Safari's canvas cost scales with total
  // output pixels, and fullscreen at devicePixelRatio 2 with 8 lanes is a
  // lot more pixels to fill than the same layout in a shrunk split-screen pane.
  const lanes = activeLaneCount();
  let dpr = Math.min(rawDpr, 2);
  if (lanes > 3) dpr = Math.min(dpr, 1.5);
  if (lanes > 6) dpr = Math.min(dpr, 1);
  const targetW = Math.round(iw * dpr), targetH = Math.round(ih * dpr);
  if (canvas.width !== targetW || canvas.height !== targetH) {
    canvas.width = targetW;
    canvas.height = targetH;
    _spriteCache.clear();
    _bgGradient = null;
  }
}
function xToCanvas(ox) { return (ox - VIEW.x0) * (canvas.width / (VIEW.x1 - VIEW.x0)); }

// ── Note sprite baking (tinted circle + untinted overlay ring) ────────
const hitcircleImg = new Image();
const overlayImg = new Image();
let imgsReady = 0;
hitcircleImg.onload = () => { imgsReady++; };
overlayImg.onload = () => { imgsReady++; };
hitcircleImg.src = SKIN_HITCIRCLE;
overlayImg.src = SKIN_OVERLAY;

const _spriteCache = new Map();
function getTintedSprite(size, isKat) {
  const osz = Math.max(2, Math.ceil(size));
  const key = (isKat ? 'k' : 'd') + osz;
  let spr = _spriteCache.get(key);
  if (spr) return spr;
  const [r, g, b] = isKat ? KAT_RGB : DON_RGB;
  spr = document.createElement('canvas');
  spr.width = osz; spr.height = osz;
  const sc = spr.getContext('2d');
  sc.fillStyle = `rgb(${r},${g},${b})`;
  sc.fillRect(0, 0, osz, osz);
  sc.globalCompositeOperation = 'destination-in';
  sc.drawImage(hitcircleImg, 0, 0, osz, osz);
  _spriteCache.set(key, spr);
  return spr;
}

// ── Lane band renderer — draws one difficulty's strip. Used once for
//    "Single" mode (one band filling the stage) and N times stacked
//    for "All diffs" mode. The x-axis mapping (xToCanvas) and the hit
//    line are shared across every band so everything stays aligned to
//    the same "now" instant.
// ══════════════════════════════════════════════════════════════════════
function renderBand(mapData, ct, top, height, label, accent, sizeRef, previewWindow) {
  const cw = canvas.width;
  const yCenter = top + height / 2;
  // note/drum sizes are derived from sizeRef (the full stage height), never
  // from this band's own height, so notes stay the same size no matter how
  // many difficulties are stacked at once.
  const ref = sizeRef || height;
  const drumR = ref * 0.115;
  const bigR = ref * 0.145;
  const normR = ref * 0.091;
  const hitCx = xToCanvas(HIT_X);

  // band background
  ctx.fillStyle = 'rgba(20,30,50,0.5)';
  ctx.fillRect(0, top, cw, height);
  ctx.strokeStyle = 'rgba(255,255,255,0.08)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0, top + 0.5); ctx.lineTo(cw, top + 0.5); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, top + height - 0.5); ctx.lineTo(cw, top + height - 0.5); ctx.stroke();

  // barlines (this band's own BPM/SV) — skipped on very thin bands, where
  // they're barely visible anyway and just add draw calls
  const { anchor, beatDur } = getBeatSegmentAt(mapData, ct);
  const mDur = beatDur * 4;
  if (mDur > 0 && height > 22) {
    const startMeasure = Math.floor((ct - 3000 - anchor) / mDur);
    const endMeasure = Math.ceil((ct + previewWindow - anchor) / mDur);
    ctx.strokeStyle = 'rgba(255,255,255,0.18)';
    ctx.setLineDash([3, 3]);
    for (let m = startMeasure; m <= endMeasure; m++) {
      const hitT = anchor + m * mDur;
      const x = getNoteX(mapData, hitT, ct);
      if (x < VIEW.x0 - 20 || x > VIEW.x1 + 20) continue;
      const cx = Math.round(xToCanvas(x)) + 0.5;
      ctx.beginPath(); ctx.moveTo(cx, top + 2); ctx.lineTo(cx, top + height - 2); ctx.stroke();
    }
    ctx.setLineDash([]);
  }

  // drum circle
  ctx.beginPath();
  ctx.arc(hitCx, yCenter, drumR, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(255,255,255,0.3)';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(hitCx, yCenter, drumR * 0.6, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(50,80,140,0.4)';
  ctx.fill();

  // hit flashes
  const isActiveTestLane = S.testPlay && mapData === S.mapData;
  const hitObjects = isActiveTestLane ? S.testNotes : mapData.hitObjects;
  {
    const flashStart = lowerBound(hitObjects, ct - 140);
    const flashEnd = lowerBound(hitObjects, ct);
    for (let i = flashStart; i < flashEnd; i++) {
      const note = hitObjects[i];
      const age = ct - note.time;
      if (age < 0 || age > 140) continue;
      const alpha = 1 - age / 140;
      const isKat = note.type.indexOf('kat') !== -1;
      const [r, g, b] = isKat ? KAT_RGB : DON_RGB;
      const rad = drumR * (1 + age / 140 * 0.55);
      ctx.beginPath();
      ctx.arc(hitCx, yCenter, rad, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(${r},${g},${b},${alpha * 0.9})`;
      ctx.lineWidth = 3;
      ctx.stroke();
    }
  }

  // notes — during test play, a note that wasn't successfully hit (still
  // unjudged, or already flagged as a miss) keeps rendering and sliding
  // past the hit line until it scrolls off-screen, same as the real game.
  // Only a genuinely-hit note (great/good) disappears the instant it's judged.
  const nStart = isActiveTestLane ? lowerBound(hitObjects, ct - previewWindow) : lowerBound(hitObjects, ct);
  const nEnd = lowerBound(hitObjects, ct + previewWindow);
  const imagesReady = imgsReady >= 2;
  for (let i = nEnd - 1; i >= nStart; i--) {
    const note = hitObjects[i];
    if (note.judged && note.result !== 'miss') continue;
    const x = getNoteX(mapData, note.time, ct);
    if (x < VIEW.x0 - 50 || x > VIEW.x1 + 50) continue;
    const cx = xToCanvas(x);
    const isBig = note.type.indexOf('big') === 0;
    const isKat = note.type.indexOf('kat') !== -1;
    const r = isBig ? bigR : normR;

    if (imagesReady) {
      const spr = getTintedSprite(r * 2 + 2, isKat);
      ctx.drawImage(spr, 0, 0, spr.width, spr.height, cx - r, yCenter - r, r * 2, r * 2);
      ctx.drawImage(overlayImg, cx - r, yCenter - r, r * 2, r * 2);
    } else {
      const [rr, gg, bb] = isKat ? KAT_RGB : DON_RGB;
      ctx.beginPath();
      ctx.arc(cx, yCenter, r, 0, Math.PI * 2);
      ctx.strokeStyle = `rgb(${rr},${gg},${bb})`;
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(cx, yCenter, r * 0.85, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${rr},${gg},${bb},0.75)`;
      ctx.fill();
    }
  }

  // label
  if (label) {
    ctx.font = `${Math.max(10, Math.min(13, height * 0.16))}px 'JetBrains Mono', monospace`;
    ctx.fillStyle = accent || 'rgba(255,255,255,0.55)';
    ctx.fillRect(6, top + 6, 3, Math.min(18, height * 0.3));
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.fillText(label, 14, top + 6 + Math.min(18, height * 0.3) * 0.5 + 4);
  }
}

// ── Main render — dispatches to one or many bands ──────────────────
function render() {
  syncCanvasSize();
  const cw = canvas.width, ch = canvas.height;
  ctx.clearRect(0, 0, cw, ch);
  if (!S.mapData) return;

  const ct = S.currentTime;

  if (!_bgGradient) {
    _bgGradient = ctx.createLinearGradient(0, 0, 0, ch);
    _bgGradient.addColorStop(0, '#0c0f16');
    _bgGradient.addColorStop(1, '#05070a');
  }
  ctx.fillStyle = _bgGradient;
  ctx.fillRect(0, 0, cw, ch);

  // Single lane only — the old "all diffs" stacked preview mode was
  // preview-tooling, not gameplay, and was removed.
  const previewWindow = 12000;
  renderBand(S.mapData, ct, 0, ch, null, null, ch, previewWindow);

  // one continuous hit line spanning the whole stage — shared "now" marker
  const hitCx = xToCanvas(HIT_X);
  ctx.strokeStyle = 'rgba(255,255,255,0.16)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(hitCx, 0); ctx.lineTo(hitCx, ch); ctx.stroke();

  if (S.testPlay) drawJudgePopups(hitCx, ch / 2);

  updateKiaiTag(ct);
}

function drawJudgePopups(hitCx, hitCy) {
  const now = performance.now();
  const life = 550;
  S.judgePopups = S.judgePopups.filter(p => now - p.spawnTime < life);
  for (const p of S.judgePopups) {
    const age = now - p.spawnTime;
    const t = age / life;
    const alpha = 1 - t;
    const yOff = -t * 34;
    ctx.save();
    ctx.globalAlpha = Math.max(0, alpha);
    ctx.font = `700 ${Math.round(canvas.height * 0.055)}px 'Zen Kaku Gothic New', sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillStyle = p.color;
    ctx.fillText(p.text, hitCx, hitCy - canvas.height * 0.16 + yOff);
    ctx.restore();
  }
}

function updateKiaiTag(ct) {
  const tag = document.getElementById('kiai-tag');
  const md = S.activeDiff ? S.activeDiff.mapData : S.mapData;
  if (!md || !md.kiaiRanges || !md.kiaiRanges.length) { tag.classList.remove('show'); return; }
  let active = false;
  for (const rg of md.kiaiRanges) { if (ct >= rg[0] && ct < rg[1]) { active = true; break; } }
  tag.classList.toggle('show', active);
}

// ══════════════════════════════════════════════════════════════════════
//  PLAYBACK ENGINE
// ══════════════════════════════════════════════════════════════════════
function stopAudioSource() {
  if (S.audioSource) {
    try { S.audioSource.onended = null; S.audioSource.stop(); } catch (e) {}
    S.audioSource = null;
  }
}

function startPlayback() {
  if (!S.mapData) return;
  if (S.isPlaying) return;
  S.isPlaying = true;
  S.playStartRealTime = performance.now();
  S.playStartMapTime = S.currentTime;

  if (S.audioCtx && S.audioBuffer) {
    if (S.audioCtx.state === 'suspended') S.audioCtx.resume();
    stopAudioSource();
    const src = S.audioCtx.createBufferSource();
    src.buffer = S.audioBuffer;
    src.playbackRate.value = S.playbackRate;
    src.connect(S.gainNode);
    if (S.currentTime < 0) {
      // Still in the lead-in — schedule the track to start once real time
      // catches up to map-time 0, rather than handing Web Audio a negative
      // offset (which throws) or starting the track early.
      const delaySec = (-S.currentTime / S.playbackRate) / 1000;
      src.start(S.audioCtx.currentTime + delaySec, 0);
      S.audioSource = src;
    } else {
      const offsetSec = S.currentTime / 1000;
      if (offsetSec < src.buffer.duration) {
        src.start(0, offsetSec);
        S.audioSource = src;
      }
    }
  }
  requestAnimationFrame(playbackLoop);
}

function pausePlayback() {
  S.isPlaying = false;
  stopAudioSource();
}

function playbackLoop(now) {
  if (!S.isPlaying) return;
  const elapsed = (now - S.playStartRealTime) * S.playbackRate;
  S.currentTime = S.playStartMapTime + elapsed;
  if (S.currentTime >= S.duration) {
    S.currentTime = S.duration;
    pausePlayback();
    if (S.testPlay) finishTestPlay(true);
  }
  if (S.testPlay) advanceTestMisses();
  if (S.testPlay) updateSkipButton();
  render();
  if (S.isPlaying) requestAnimationFrame(playbackLoop);
}

// ══════════════════════════════════════════════════════════════════════
//  LOADING .osz — arrives as a File built from bytes sent over postMessage
//  by the song select screen (see the embed bridge at the bottom of this
//  file). There's no file picker or drag-drop target anymore.
// ══════════════════════════════════════════════════════════════════════
const stageWrap = document.getElementById('stage-wrap');
const loadingOverlay = document.getElementById('loading-overlay');
const loadingMsg = document.getElementById('loading-msg');


function showError(msg) {
  console.error(msg);
  if (window.parent !== window) window.parent.postMessage({ type: 'taiko-load-error', message: msg }, '*');
}

async function handleFile(file) {
  if (!/\.osz$/i.test(file.name)) {
    showError('That doesn\'t look like an .osz file — please pick an osu! beatmap package.');
    return;
  }
  loadingOverlay.classList.add('show');
  loadingMsg.textContent = 'Reading package…';
  if (S.testPlay) exitTestPlay();
  pausePlayback();

  try {
    const zip = await JSZip.loadAsync(file);
    const osuPaths = Object.keys(zip.files).filter(f => /\.osu$/i.test(f) && !zip.files[f].dir);
    if (osuPaths.length === 0) throw new Error('No .osu difficulty files found inside this package.');

    loadingMsg.textContent = 'Parsing difficulties…';
    const diffs = [];
    for (const path of osuPaths) {
      const text = await zip.files[path].async('string');
      const mapData = parseOSU(text);
      // A beatmap set's .osz bundles every difficulty from every mode the
      // mapper made (std/taiko/ctb/mania) — this is a taiko-only player, so
      // anything that isn't Mode:1 must be dropped here, not merely hidden
      // in the song-select list, or it can end up picked as the default diff.
      if (mapData.mode !== 1) continue;
      diffs.push({ path, mapData });
    }
    if (diffs.length === 0) throw new Error('No osu!taiko difficulties found inside this package — it may only contain other game modes.');
    diffs.sort((a, b) => a.mapData.hitObjects.length - b.mapData.hitObjects.length);

    loadingMsg.textContent = 'Decoding audio…';
    S.audioBuffer = null;
    S.zip = zip;
    S.diffs = diffs;
    await loadAudioFromZip(zip, diffs[diffs.length - 1].mapData);

    await selectDiff(diffs[diffs.length - 1].path);

    loadingOverlay.classList.remove('show');
  } catch (err) {
    console.error(err);
    loadingOverlay.classList.remove('show');
    showError('Couldn\'t load that file: ' + (err && err.message ? err.message : err));
  }
}

async function loadAudioFromZip(zip, mapDataHint) {
  try {
    if (!S.audioCtx) {
      S.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      S.gainNode = S.audioCtx.createGain();
      S.gainNode.gain.value = 0.8; // no volume slider anymore; fixed sensible default
      S.gainNode.connect(S.audioCtx.destination);
    }
    let audioPath = null;
    if (mapDataHint && mapDataHint.audioFilename) {
      const want = mapDataHint.audioFilename.toLowerCase();
      audioPath = Object.keys(zip.files).find(f => f.toLowerCase().endsWith(want));
    }
    if (!audioPath) {
      audioPath = Object.keys(zip.files).find(f => /\.(mp3|ogg|wav)$/i.test(f));
    }
    if (audioPath) {
      const buf = await zip.files[audioPath].async('arraybuffer');
      S.audioBuffer = await S.audioCtx.decodeAudioData(buf.slice(0));
    }
  } catch (e) {
    console.warn('Audio decode failed:', e);
  }
}

function computeOverallDuration() {
  let dur = 0;
  for (const d of S.diffs) dur = Math.max(dur, d.mapData.duration);
  if (S.audioBuffer) dur = Math.max(dur, S.audioBuffer.duration * 1000 + 500);
  return dur;
}

async function selectDiff(path) {
  const entry = S.diffs.find(d => d.path === path);
  if (!entry) return;
  if (S.testPlay) exitTestPlay();
  const wasPlaying = S.isPlaying;
  pausePlayback();
  S.activeDiff = entry;
  S.mapData = entry.mapData;
  S.duration = computeOverallDuration();
  S.currentTime = 0;

  await setBackground(entry.mapData.backgroundFile);

  render();
  if (wasPlaying) startPlayback();
}

async function setBackground(bgFile) {
  const bgEl = document.getElementById('stage-bg');
  bgEl.style.backgroundImage = 'none';
  if (!bgFile || !S.zip) return;
  const want = bgFile.toLowerCase();
  const path = Object.keys(S.zip.files).find(f => f.toLowerCase().endsWith(want));
  if (!path) return;
  try {
    const blob = await S.zip.files[path].async('blob');
    const dataUrl = await bakeBlurredBackground(blob);
    if (dataUrl) bgEl.style.backgroundImage = `url("${dataUrl}")`;
  } catch (e) { /* ignore */ }
}

// Bakes a blurred, darkened, tiny copy of the background art ONE TIME and
// hands back a small data URL. The stage then just shows that static bitmap
// stretched with plain CSS background-size:cover — a cheap image scale, not
// a live filter. This is what actually fixed the fps drop: a running CSS
// blur filter on a full-size layer gets re-composited (and re-paid for)
// every time anything above it repaints, and its cost scales with how much
// screen area it covers — exactly the "fps tracks resolution" symptom.
async function bakeBlurredBackground(blob) {
  let img;
  let tempUrl = null;
  try {
    img = await createImageBitmap(blob);
  } catch (e) {
    img = await new Promise((resolve, reject) => {
      const el = new Image();
      el.onload = () => resolve(el);
      el.onerror = reject;
      tempUrl = URL.createObjectURL(blob);
      el.src = tempUrl;
    });
  }
  const iw = img.width || img.naturalWidth || 1;
  const ih = img.height || img.naturalHeight || 1;
  const targetW = 48;
  const targetH = Math.max(1, Math.round(targetW * (ih / iw)));
  const off = document.createElement('canvas');
  off.width = targetW; off.height = targetH;
  const octx = off.getContext('2d');
  // A small extra blur softens downscale artifacts; cheap because it only
  // ever runs once, on a 48px-wide canvas.
  octx.filter = 'blur(2px) brightness(0.55) saturate(1.05)';
  octx.drawImage(img, 0, 0, targetW, targetH);
  if (img.close) img.close();
  if (tempUrl) URL.revokeObjectURL(tempUrl);
  return off.toDataURL('image/jpeg', 0.7);
}

// ══════════════════════════════════════════════════════════════════════
//  TEST PLAY — actually play the current single difficulty yourself.
//  D/F = left kat/don, J/K = right don/kat (osu!taiko's default layout),
//  plus on-screen drum zones for touch. Transport controls are hidden
//  entirely while playing; a small HUD (combo/accuracy + exit) replaces
//  them, matching how the real game hides its editor chrome during play.
// ══════════════════════════════════════════════════════════════════════
const KEY_COLOR = { d: 'kat', f: 'don', j: 'don', k: 'kat' };
// Physical-position map (KeyboardEvent.code) — used as the primary lookup so
// non-QWERTY layouts (Dvorak, AZERTY, etc.) still map the D/F/J/K *positions*
// correctly even though e.key would report different characters there.
const CODE_COLOR = { KeyD: 'kat', KeyF: 'don', KeyJ: 'don', KeyK: 'kat' };
const CODE_PAIR = { KeyD: 'KeyK', KeyK: 'KeyD', KeyF: 'KeyJ', KeyJ: 'KeyF' };
const appEl = document.getElementById('app');
const testResultsEl = document.getElementById('test-results');

function startTestPlay() {
  if (!S.mapData) return;
  pausePlayback();
  S.testNotes = S.mapData.hitObjects.map(n => ({ time: n.time, type: n.type, judged: false, result: null }));
  S.testStats = { great: 0, good: 0, miss: 0, combo: 0, maxCombo: 0, score: 0 };
  S.testMissPtr = 0;
  S.judgePopups = [];
  S.heldKeys = {};
  S.testPlay = true;
  testResultsEl.classList.remove('show');
  appEl.classList.add('testing');
  updateTestHUD();

  // A short lead-in before map-time 0, sized to whichever is larger: the
  // map's own AudioLeadIn, or a minimum enough for the very first note to
  // scroll in from off-screen instead of appearing already on the hit line.
  // Only kicks in if the first note is actually that close to the start —
  // maps with a naturally long intro already have plenty of runway and
  // start at 0 (the skip button covers those instead).
  const firstNoteTime = S.testNotes.length ? S.testNotes[0].time : 0;
  const requiredGap = Math.min(5000, Math.max(2000, S.mapData.audioLeadIn || 0));
  S.testSkipTargetTime = firstNoteTime - requiredGap;
  S.currentTime = Math.min(0, S.testSkipTargetTime);

  render();
  startPlayback();
  // This whole flow starts from a postMessage, not a click inside this
  // frame, so keyboard focus may still be sitting in the parent document
  // (e.g. on the Play button). A single focus() call right here has been
  // unreliable in practice — retry it over the next few frames in case
  // something else (the frame still settling, a pending layout/paint) wins
  // the race the first time.
  grabFocus();
}

function grabFocus(attemptsLeft) {
  if (attemptsLeft == null) attemptsLeft = 6;
  window.focus();
  if (!document.body.hasAttribute('tabindex')) document.body.setAttribute('tabindex', '-1');
  if (document.activeElement !== document.body) document.body.focus();
  if (attemptsLeft > 0 && !document.hasFocus()) {
    setTimeout(() => grabFocus(attemptsLeft - 1), 80);
  } else {
    console.log('[focus] hasFocus =', document.hasFocus(), '· activeElement =', document.activeElement && document.activeElement.tagName);
  }
}

function exitTestPlay() {
  pausePlayback();
  S.testPlay = false;
  appEl.classList.remove('testing');
  testResultsEl.classList.remove('show');
  render();
}

function finishTestPlay(reachedEnd) {
  pausePlayback();
  appEl.classList.remove('testing');
  const st = S.testStats;
  const totalJudged = st.great + st.good + st.miss;
  const acc = totalJudged ? ((st.great + st.good * 0.5) / totalJudged * 100) : 100;
  document.getElementById('test-results-title').textContent = reachedEnd ? 'Cleared!' : 'Stopped';
  document.getElementById('res-acc').textContent = acc.toFixed(2) + '%';
  document.getElementById('res-great').textContent = st.great;
  document.getElementById('res-good').textContent = st.good;
  document.getElementById('res-miss').textContent = st.miss;
  document.getElementById('res-combo').textContent = st.maxCombo;
  testResultsEl.classList.add('show');
  S.testPlay = false;
  render();
}

// ── Pause menu — Continue/Retry/Quit, distinct from finishTestPlay (which
// shows the results screen). Pausing keeps S.testPlay true and all note/
// judgement state intact so Continue can resume exactly where it left off.
const testPauseEl = document.getElementById('test-pause');
function openPauseMenu() {
  if (!S.testPlay || testPauseEl.classList.contains('show')) return;
  pausePlayback();
  testPauseEl.classList.add('show');
}
function closePauseMenu() {
  testPauseEl.classList.remove('show');
  if (S.testPlay) startPlayback();
}
function quitTestPlay() {
  testPauseEl.classList.remove('show');
  pausePlayback();
  S.testPlay = false;
  appEl.classList.remove('testing');
  testResultsEl.classList.remove('show');
  render();
  // Hand control back to the song select screen if we're embedded in it.
  if (window.parent !== window) window.parent.postMessage({ type: 'taiko-quit' }, '*');
}
document.getElementById('btn-pause-continue').addEventListener('click', closePauseMenu);
document.getElementById('btn-pause-retry').addEventListener('click', () => { testPauseEl.classList.remove('show'); startTestPlay(); });
document.getElementById('btn-pause-quit').addEventListener('click', quitTestPlay);

function advanceTestMisses() {
  const notes = S.testNotes;
  if (!notes) return;
  const missW = missWindowMs(S.mapData.od);
  const ct = S.currentTime;
  while (S.testMissPtr < notes.length) {
    const n = notes[S.testMissPtr];
    if (n.time + missW >= ct) break;
    if (!n.judged) {
      n.judged = true;
      n.result = 'miss';
      S.testStats.miss++;
      S.testStats.combo = 0;
      spawnJudgePopup('MISS', 'var(--text-dim)');
      updateTestHUD();
    }
    S.testMissPtr++;
  }
}

// Notelock: only the front-most unresolved note is ever reachable by a
// keypress — a note further down the chart can't be sniped early just
// because the timing happens to line up better than the note it's stuck
// behind. The real game (and this one) always resolves the earliest
// unjudged note first, hit, miss, or otherwise; S.testMissPtr tracks which
// one that is.
function judgeInput(color, simultBonus) {
  if (!S.testPlay || !S.testNotes) return;
  const notes = S.testNotes;
  const idx = S.testMissPtr;
  if (idx >= notes.length) return; // nothing left to hit
  const n = notes[idx];
  if (n.judged) return; // shouldn't happen — pointer always sits on the front unresolved note

  const od = S.mapData.od;
  const greatW = greatWindowMs(od);
  const goodW = goodWindowMs(od);
  const missW = missWindowMs(od);
  const ct = S.currentTime;
  const diff = Math.abs(n.time - ct);
  if (diff > missW) return; // the locked note isn't in range yet — press is wasted, no penalty

  const nColor = n.type.indexOf('kat') !== -1 ? 'kat' : 'don';
  n.judged = true;
  S.testMissPtr = idx + 1;

  if (nColor !== color || diff > goodW) {
    // Either the wrong drum for this note, or the right drum but outside
    // even the Good window (still inside the wider Miss window though) —
    // both resolve the note as a miss instead of being ignored. Without
    // this, mashing every key nonstop is free: the correct drum eventually
    // lands close enough to land in-window while everything else costs
    // nothing, so you never actually need to read the chart or the rhythm.
    // Consuming the note on the *first* press that reaches this window,
    // right or wrong, means only one shot at it — mashing now costs combo.
    n.result = 'miss';
    S.testStats.miss++;
    S.testStats.combo = 0;
    spawnJudgePopup('MISS', 'var(--text-dim)');
    updateTestHUD();
    return;
  }

  if (diff <= greatW) {
    n.result = 'great';
    S.testStats.great++;
    spawnJudgePopup(simultBonus ? 'GREAT ✦' : 'GREAT', color === 'kat' ? 'var(--kat)' : 'var(--don)');
  } else {
    n.result = 'good';
    S.testStats.good++;
    spawnJudgePopup('GOOD', 'var(--accent)');
  }
  S.testStats.combo++;
  S.testStats.maxCombo = Math.max(S.testStats.maxCombo, S.testStats.combo);
  S.testStats.score += (n.result === 'great' ? 300 : 150);
  updateTestHUD();
}

function spawnJudgePopup(text, color) {
  S.judgePopups.push({ text, color, spawnTime: performance.now() });
}

function updateTestHUD() {
  const st = S.testStats;
  if (!st) return;
  document.getElementById('test-combo-n').textContent = st.combo;
  const totalJudged = st.great + st.good + st.miss;
  const acc = totalJudged ? ((st.great + st.good * 0.5) / totalJudged * 100) : 100;
  document.getElementById('test-acc').textContent = acc.toFixed(2) + '%';
}

// The skip button only appears while there's meaningfully more runway left
// before the action starts than a normal lead-in would give — covers both
// our own artificial lead-in (trivial, stays hidden) and a genuinely long
// intro in the map itself (the actual "skip long intros" case).
function updateSkipButton() {
  const btn = document.getElementById('test-skip-btn');
  if (!S.testPlay || S.testSkipTargetTime == null) { btn.classList.remove('show'); return; }
  const remaining = S.testSkipTargetTime - S.currentTime;
  btn.classList.toggle('show', remaining > 1500);
}

function skipIntro() {
  if (!S.testPlay || S.testSkipTargetTime == null) return;
  pausePlayback();
  S.currentTime = S.testSkipTargetTime;
  document.getElementById('test-skip-btn').classList.remove('show');
  render();
  startPlayback();
}

// keyboard input — held-key timestamps let us flag near-simultaneous
// same-color presses (the real big-note "kacchan" double-hit) for flair.
// We match on the physical key position (e.code) rather than the character
// (e.key) so the D/F/J/K positions work the same on any keyboard layout —
// e.g. on Dvorak those physical keys report as e/u/h/t, not d/f/j/k.
document.addEventListener('keydown', (e) => {
  if (!S.testPlay) return;
  if (e.repeat) return;
  if (e.key === 'Escape') { openPauseMenu(); return; }
  if (testPauseEl.classList.contains('show')) return; // ignore drum input while paused
  const code = CODE_COLOR[e.code] ? e.code : (KEY_COLOR[e.key.toLowerCase()] ? 'Key' + e.key.toUpperCase() : null);
  const color = code ? CODE_COLOR[code] : null;
  if (!color) return;
  e.preventDefault();
  const now = performance.now();
  const pairCode = CODE_PAIR[code];
  const simultBonus = S.heldKeys[pairCode] && (now - S.heldKeys[pairCode] < 40);
  S.heldKeys[code] = now;
  judgeInput(color, simultBonus);
});
document.addEventListener('keyup', (e) => {
  const code = CODE_COLOR[e.code] ? e.code : (KEY_COLOR[e.key.toLowerCase()] ? 'Key' + e.key.toUpperCase() : null);
  if (code) delete S.heldKeys[code];
});

// touch / mouse drum zones
document.querySelectorAll('.drum-zone').forEach(btn => {
  const code = btn.dataset.code;
  const color = CODE_COLOR[code];
  const trigger = (e) => {
    e.preventDefault();
    if (!S.testPlay || testPauseEl.classList.contains('show')) return;
    btn.classList.add('pressed');
    const now = performance.now();
    const pairCode = CODE_PAIR[code];
    const simultBonus = S.heldKeys[pairCode] && (now - S.heldKeys[pairCode] < 40);
    S.heldKeys[code] = now;
    judgeInput(color, simultBonus);
    setTimeout(() => { delete S.heldKeys[code]; btn.classList.remove('pressed'); }, 60);
  };
  btn.addEventListener('pointerdown', trigger);
});

document.getElementById('btn-test-exit').addEventListener('click', openPauseMenu);
document.getElementById('test-skip-btn').addEventListener('click', skipIntro);
document.getElementById('btn-test-retry').addEventListener('click', () => { testResultsEl.classList.remove('show'); startTestPlay(); });
document.getElementById('btn-test-back').addEventListener('click', quitTestPlay);

window.addEventListener('resize', () => render());
new ResizeObserver(() => render()).observe(stageWrap);

// Belt-and-suspenders: a real click inside the frame always grants it
// keyboard focus in every browser, no exceptions — so even if the
// automatic grabFocus() calls above don't stick for some reason, clicking
// anywhere on the stage guarantees keyboard input starts working.
stageWrap.addEventListener('pointerdown', () => { window.focus(); document.body.focus(); });

// ══════════════════════════════════════════════════════════════════════
//  EMBED BRIDGE — lets a parent page (the song select screen) hand off a
//  downloaded .osz directly instead of the user picking a file, then jump
//  straight into test play. Only relevant when running inside an iframe.
// ══════════════════════════════════════════════════════════════════════
window.addEventListener('message', async (e) => {
  const data = e.data;
  if (!data || data.type !== 'taiko-load') return;
  try {
    const file = new File([data.buffer], data.filename || 'beatmap.osz', { type: 'application/zip' });
    await handleFile(file);
    if (!S.diffs || !S.diffs.length) throw new Error('no difficulties found in package');
    // handleFile already selects the hardest diff by default — try to match
    // the difficulty the player actually picked in song select, by keyword
    // (e.g. "Oni"), falling back to that default if nothing matches.
    if (data.diffHint) {
      const hint = String(data.diffHint).toLowerCase();
      const match = S.diffs.find(d => (d.mapData.version || '').toLowerCase().includes(hint));
      if (match) await selectDiff(match.path);
    }
    startTestPlay();
  } catch (err) {
    console.error('embed load failed:', err);
    if (window.parent !== window) {
      window.parent.postMessage({ type: 'taiko-load-error', message: String(err && err.message || err) }, '*');
    }
  }
});

if (window.parent !== window) {
  window.parent.postMessage({ type: 'taiko-ready' }, '*');
}
</script>
</body>
</html>
