<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TaikoSB — Song Select</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap');

:root{
  /* Neutral charcoal palette — matches the editor's cover page */
  --bg0:   #1f1f1f;
  --bg1:   #262626;
  --bg2:   #2d2d2d;
  --bg3:   #383838;
  --bg4:   #454545;
  --panel: #2a2a2a;
  --border: #141414;
  --border-soft: #363636;

  /* Olive-green primary accent */
  --accent:      #7aa84a;
  --accent-dim:  #5e8438;
  --accent-glow: rgba(122,168,74,0.30);

  /* Warm secondary accent */
  --warm:        #d97757;
  --warm-dim:    #a85a40;
  --warm-glow:   rgba(217,119,87,0.28);

  /* Note colours */
  --don:    #d94747;
  --kat:    #5cc7c7;

  /* Difficulty ladder, tuned to sit alongside the accent/warm pair */
  --kantan:     #7aa84a;
  --futsuu:     #d9b95c;
  --muzukashii: #d97757;
  --oni:        #d94747;
  --ura:        #b48ad9;

  --text:        #d4d4d4;
  --text-dim:    #8a8a8a;
  --text-bright: #f0f0f0;

  --r: 6px;
  --r-sm: 4px;
}

*{ box-sizing:border-box; margin:0; padding:0; }
html, body{ height:100%; overflow:hidden; }

body{
  font-family:'Quicksand','Nunito',sans-serif;
  background:
    radial-gradient(ellipse 900px 500px at 16% 10%, rgba(122,168,74,0.10), transparent 60%),
    radial-gradient(ellipse 700px 500px at 90% 94%, rgba(217,119,87,0.09), transparent 60%),
    var(--bg0);
  color:var(--text);
  height:100vh;
  overflow:hidden;
  position:relative;
}

/* ambient wash tied to the selected track — sits above the base gradient */
#wash{
  position:absolute; inset:0; z-index:0;
  background: radial-gradient(circle at 78% 25%, var(--wash-a, transparent) 0%, transparent 55%),
              radial-gradient(circle at 15% 82%, var(--wash-b, transparent) 0%, transparent 50%);
  transition: background 0.6s ease;
  opacity:0.55;
}

/* faint grid + drifting notes, echoes the editor's title screen */
#grain{
  position:absolute; inset:0; z-index:0; pointer-events:none; overflow:hidden;
  background-image:
    linear-gradient(rgba(122,168,74,0.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(122,168,74,0.05) 1px, transparent 1px);
  background-size:44px 44px;
  -webkit-mask-image: radial-gradient(ellipse 80% 80% at 50% 40%, black 40%, transparent 92%);
          mask-image: radial-gradient(ellipse 80% 80% at 50% 40%, black 40%, transparent 92%);
}
.drift-note{
  position:absolute; right:-60px; border-radius:50%;
  filter:saturate(0.7) brightness(0.9);
  animation: driftNote linear infinite;
  will-change: transform;
}
@keyframes driftNote{
  from{ transform:translateX(0); }
  to  { transform:translateX(-130vw); }
}

.screen{ position:relative; z-index:2; height:100%; display:flex; flex-direction:column; }

/* ---------- top bar ---------- */
.topbar{
  display:flex; align-items:center; justify-content:space-between;
  padding:16px 36px 12px;
  border-bottom:1px solid var(--border-soft);
  background:rgba(38,38,38,0.5);
}
.brand{ display:flex; align-items:center; gap:14px; }
.brand-icon{
  font-size:1.9rem;
  filter:drop-shadow(0 0 16px var(--accent-glow));
  animation: logoBob 4.5s ease-in-out infinite;
}
@keyframes logoBob{
  0%,100%{ transform:translateY(0) rotate(0deg); }
  50%{ transform:translateY(-3px) rotate(-2deg); }
}
.brand-text h1{
  font-family:'Nunito',sans-serif; font-size:1.5rem; font-weight:800;
  letter-spacing:0.5px; color:var(--text-bright); line-height:1;
  display:flex; align-items:baseline; gap:8px;
}
.brand-text h1 .accent{ color:var(--accent); text-shadow:0 0 20px var(--accent-glow); }
.brand-text h1 small{
  font-family:'Nunito',sans-serif; font-size:0.62rem; font-weight:700;
  letter-spacing:2.5px; color:var(--text-dim); text-transform:uppercase;
}
.eyebrow{
  display:inline-flex; align-items:center; gap:6px;
  font-family:'Nunito',sans-serif; font-size:0.56rem; font-weight:800;
  letter-spacing:1.5px; text-transform:uppercase;
  color:var(--accent); background:rgba(122,168,74,0.12);
  border:1px solid rgba(122,168,74,0.35); border-radius:20px;
  padding:2px 9px; margin-top:3px;
}
.searchhint{ display:flex; gap:10px; align-items:center; }
.searchhint .hint{
  display:flex; align-items:center; gap:5px;
  font-size:0.62rem; font-weight:600; color:var(--text-dim); letter-spacing:0.3px;
}
kbd{
  background:var(--bg3); border:1px solid var(--border); border-radius:5px;
  padding:2px 7px; font-size:0.62rem; font-weight:700; color:var(--text-bright);
  font-family:'Nunito',sans-serif;
}

/* ---------- main body ---------- */
.main{ flex:1; display:flex; min-height:0; padding:20px 36px; gap:24px; }

/* left info panel */
.infopanel{ width:350px; flex-shrink:0; display:flex; flex-direction:column; gap:14px; min-height:0; }

.cover{
  height:180px; border-radius:var(--r); position:relative; overflow:hidden;
  background: linear-gradient(135deg, var(--cover-a,#333), var(--cover-b,#1a1a1a));
  border:1px solid var(--border-soft);
  display:flex; align-items:flex-end;
}
.cover::before{
  content:''; position:absolute; top:0; left:0; right:0; height:3px;
  background:var(--diff-color, var(--accent)); opacity:0.85; z-index:2;
  transition:background 0.2s ease;
}
.cover::after{
  content:""; position:absolute; inset:0;
  background: linear-gradient(to top, rgba(0,0,0,0.7), transparent 60%);
}
.cover-title{ position:relative; z-index:1; padding:14px 16px 2px; font-family:'Nunito',sans-serif; font-weight:800; font-size:1.05rem; line-height:1.25; color:var(--text-bright); }
.cover-artist{ position:relative; z-index:1; padding:0 16px 12px; font-size:0.72rem; font-weight:600; color:var(--text-dim); }

.meta-row{ display:flex; gap:8px; }
.meta-chip{
  background:var(--bg1); border:1px solid var(--border-soft); border-radius:var(--r-sm);
  padding:7px 8px; flex:1; text-align:center;
}
.meta-chip .val{ font-family:'Nunito'; font-weight:800; font-size:1.05rem; color:var(--text-bright); }
.meta-chip .lbl{ font-size:0.56rem; font-weight:700; color:var(--text-dim); letter-spacing:1.5px; margin-top:2px; }

.mapper{ font-size:0.7rem; font-weight:600; color:var(--text-dim); }
.mapper b{ color:var(--text-bright); font-weight:800; }

/* difficulty selector, styled like the editor's diff-item picker */
.diff-label{ font-size:0.6rem; font-weight:800; letter-spacing:1.5px; color:var(--text-dim); text-transform:uppercase; margin-bottom:2px; }
.difficulties{ display:flex; flex-direction:column; gap:6px; }
.diff-btn{
  display:flex; align-items:center; gap:10px;
  background:var(--bg2); border:1px solid var(--border-soft); border-left:3px solid var(--diff-color, var(--accent));
  border-radius:var(--r-sm); padding:7px 12px; cursor:pointer;
  transition: transform 0.15s, background 0.15s, border-color 0.15s;
}
.diff-btn:hover{ background:var(--bg3); transform:translateX(2px); }
.diff-btn.active{
  background:var(--bg3);
  box-shadow:0 0 0 1px var(--diff-color, var(--accent)), 0 0 18px -4px var(--diff-color, var(--accent));
}
.drum-dot{
  width:24px; height:24px; border-radius:50%; flex-shrink:0;
  background:radial-gradient(circle at 35% 30%, rgba(255,255,255,0.35), transparent 60%), var(--diff-color);
  border:2px solid rgba(255,255,255,0.15);
}
.diff-name{ font-weight:700; font-size:0.78rem; flex:1; color:var(--text-bright); }
.diff-stars{ font-size:0.66rem; font-weight:700; color:var(--diff-color); letter-spacing:1px; }

/* note preview strip */
.notestrip{
  margin-top:auto; height:54px; border-radius:var(--r-sm);
  background:var(--bg1); border:1px solid var(--border-soft);
  position:relative; overflow:hidden;
}
.notestrip .rail{ position:absolute; left:50px; top:0; bottom:0; width:2px; background:var(--accent); opacity:.5; }
.notestrip .judge-ring{
  position:absolute; left:28px; top:50%; transform:translateY(-50%);
  width:40px; height:40px; border-radius:50%; border:3px solid var(--text-dim); opacity:.6;
}
.notestrip .track{
  position:absolute; top:0; left:56px; right:0; bottom:0;
  display:flex; align-items:center;
  animation: scroll-notes 4s linear infinite;
}
.note{ width:32px; height:32px; border-radius:50%; flex-shrink:0; margin-right:24px; border:3px solid rgba(255,255,255,0.2); }
.note.don{ background:var(--don); }
.note.katsu{ background:var(--kat); }
.note.big{ width:42px; height:42px; }
@keyframes scroll-notes{ from{ transform:translateX(0); } to{ transform:translateX(-580px); } }

/* ---------- song list (right) ---------- */
.songlist-wrap{ flex:1; min-width:0; display:flex; flex-direction:column; min-height:0; }

.filter-bar{
  display:flex; flex-wrap:wrap; gap:8px; align-items:center;
  margin-bottom:10px; padding:10px; border-radius:var(--r);
  background:var(--bg1); border:1px solid var(--border-soft);
}
.filter-input{
  flex:1 1 180px; min-width:140px;
  background:var(--bg2); border:1px solid var(--border-soft); border-radius:var(--r-sm);
  color:var(--text-bright); font-family:'Nunito'; font-size:0.72rem; font-weight:600;
  padding:7px 10px;
}
.filter-input::placeholder{ color:var(--text-dim); }
.filter-select{
  background:var(--bg2); border:1px solid var(--border-soft); border-radius:var(--r-sm);
  color:var(--text-bright); font-family:'Nunito'; font-size:0.7rem; font-weight:700;
  padding:7px 8px; cursor:pointer;
}
.filter-range{ display:flex; align-items:center; gap:4px; }
.filter-label{ font-size:0.62rem; font-weight:800; color:var(--text-dim); letter-spacing:0.5px; margin-right:2px; }
.filter-dash{ color:var(--text-dim); font-size:0.7rem; }
.filter-num{
  width:52px; background:var(--bg2); border:1px solid var(--border-soft); border-radius:var(--r-sm);
  color:var(--text-bright); font-family:'Nunito'; font-size:0.7rem; font-weight:600;
  padding:6px 6px; text-align:center;
}
.filter-num::-webkit-inner-spin-button{ opacity:0.4; }
.filter-apply{
  font-family:'Nunito'; font-size:0.68rem; font-weight:800; letter-spacing:0.5px; text-transform:uppercase;
  color:#fff; background:var(--accent); border:1px solid var(--accent); border-radius:var(--r-sm);
  padding:8px 16px; cursor:pointer; transition:filter 0.15s;
}
.filter-apply:hover{ filter:brightness(1.1); }

.list-toolbar{ display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; padding:0 2px; gap:10px; }
.count{ font-size:0.62rem; font-weight:700; color:var(--text-dim); letter-spacing:0.5px; white-space:nowrap; }

.songlist{ flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:6px; padding-right:6px; }
.songlist::-webkit-scrollbar{ width:8px; }
.songlist::-webkit-scrollbar-thumb{ background:var(--bg4); border-radius:20px; }
.songlist::-webkit-scrollbar-track{ background:transparent; }

.song-row{
  display:flex; align-items:center; gap:13px;
  background:var(--bg1); border:1px solid var(--border-soft);
  border-left:5px solid var(--row-color, var(--border-soft));
  border-radius:var(--r); padding:9px 16px 9px 13px; cursor:pointer;
  position:relative;
  transition: transform 0.13s, background 0.13s, box-shadow 0.13s;
}
/* faint colour wash bleeding in from the difficulty edge — echoes the edge
   colour without turning the whole row into a colour block */
.song-row::before{
  content:''; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
  background:linear-gradient(90deg, var(--row-color, transparent) 0%, transparent 42%);
  opacity:0.07;
}
.song-row:hover{ background:var(--bg2); transform:translateX(2px); box-shadow:0 0 16px -9px var(--row-color, var(--bg4)); }
.song-row.selected{
  background:var(--bg2);
  transform:translateX(4px);
  box-shadow:0 0 22px -6px var(--row-color), inset 0 0 0 1px var(--row-color);
}
.song-cover{
  width:44px; height:44px; border-radius:9px; flex-shrink:0; position:relative; overflow:hidden;
  background:radial-gradient(circle at 35% 30%, rgba(255,255,255,0.35), transparent 60%), var(--row-color);
  border:2px solid rgba(255,255,255,0.15);
  z-index:1; /* sit above the row's colour-wash pseudo-element */
}
.song-cover img{
  position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
  opacity:0; transition:opacity 0.3s ease;
}
.song-cover img.loaded{ opacity:1; }
.song-text{ flex:1; min-width:0; position:relative; z-index:1; }
.song-title{ font-weight:700; font-size:0.86rem; color:var(--text-bright); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.song-artist{ font-size:0.7rem; font-weight:600; color:var(--text-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.song-stars{ font-size:0.68rem; font-weight:700; color:var(--row-color); flex-shrink:0; letter-spacing:1px; position:relative; z-index:1; }
.song-bpm{ font-size:0.68rem; font-weight:600; color:var(--text-dim); width:62px; text-align:right; flex-shrink:0; position:relative; z-index:1; }

/* ---------- bottom bar ---------- */
.bottombar{
  display:flex; justify-content:space-between; align-items:center;
  padding:14px 36px 20px; border-top:1px solid var(--border-soft);
  background:rgba(38,38,38,0.5);
}
.btn{
  font-family:'Nunito'; font-weight:700; font-size:0.72rem; letter-spacing:0.5px;
  background:var(--bg3); border:1px solid var(--border); color:var(--text);
  padding:10px 18px; border-radius:20px; cursor:pointer; transition:all 0.15s;
}
.btn:hover{ background:var(--bg4); border-color:var(--accent); color:var(--text-bright); box-shadow:0 0 10px var(--accent-glow); }
.btn:active{ transform:scale(0.96); }
.btn.random:hover{ border-color:var(--warm); box-shadow:0 0 10px var(--warm-glow); }
.left-btns{ display:flex; gap:10px; }
.btn-play{
  font-family:'Nunito'; font-weight:800; font-size:0.95rem; letter-spacing:1px;
  background:linear-gradient(135deg, var(--don), #a01528);
  border:none; color:#fff; padding:13px 44px; border-radius:999px; cursor:pointer;
  box-shadow:0 4px 20px -4px rgba(217,71,71,0.6); transition:filter 0.15s, transform 0.1s;
}
.btn-play:hover{ filter:brightness(1.12); }
.btn-play:active{ transform:scale(0.97); }
</style>
</head>
<body>
<div id="wash"></div>
<div id="grain"></div>

<div class="screen">
  <div class="topbar">
    <div class="brand">
      <div class="brand-icon">🥁</div>
      <div class="brand-text">
        <div class="eyebrow">osu!taiko</div>
        <h1>TAIKO<span class="accent">SB</span><small>Song Select</small></h1>
      </div>
    </div>
    <div class="searchhint">
      <div class="hint">Navigate <kbd>↑</kbd><kbd>↓</kbd></div>
      <div class="hint">Difficulty <kbd>←</kbd><kbd>→</kbd></div>
      <div class="hint">Play <kbd>Enter</kbd></div>
      <div class="hint" id="debugToggle" style="cursor:pointer; text-decoration:underline;">🐞 debug console</div>
      <div class="hint" id="retryFetch" style="cursor:pointer; text-decoration:underline;">🔄 retry fetch</div>
    </div>
  </div>

  <div class="main">
    <div class="infopanel">
      <div class="cover" id="cover">
        <div class="cover-title" id="coverTitle"></div>
      </div>
      <div class="cover-artist" id="coverArtist"></div>

      <div class="meta-row">
        <div class="meta-chip"><div class="val" id="metaBpm"></div><div class="lbl">BPM</div></div>
        <div class="meta-chip"><div class="val" id="metaLen"></div><div class="lbl">LENGTH</div></div>
        <div class="meta-chip"><div class="val" id="metaStars"></div><div class="lbl">STARS</div></div>
      </div>

      <div class="mapper">Mapped by <b id="mapperName"></b></div>

      <div>
        <div class="diff-label">Difficulty</div>
        <div class="difficulties" id="diffList"></div>
      </div>

      <div class="notestrip">
        <div class="judge-ring"></div>
        <div class="rail"></div>
        <div class="track" id="noteTrack"></div>
      </div>
    </div>

    <div class="songlist-wrap">
      <div class="filter-bar">
        <input type="text" id="filterQuery" class="filter-input" placeholder="Search title, artist, mapper…">
        <select id="filterSort" class="filter-select">
          <option value="plays_desc">Most played</option>
          <option value="ranked_desc" selected>Newest ranked</option>
          <option value="favourites_desc">Most favourited</option>
          <option value="title_asc">Title A–Z</option>
          <option value="difficulty_desc">Hardest first</option>
          <option value="difficulty_asc">Easiest first</option>
        </select>
        <select id="filterStatus" class="filter-select">
          <option value="1">Ranked</option>
          <option value="4">Loved</option>
          <option value="2">Approved</option>
          <option value="3">Qualified</option>
          <option value="">All statuses</option>
        </select>
        <div class="filter-range">
          <span class="filter-label">★</span>
          <input type="number" id="filterMinStars" class="filter-num" min="0" max="15" step="0.1" placeholder="min">
          <span class="filter-dash">–</span>
          <input type="number" id="filterMaxStars" class="filter-num" min="0" max="15" step="0.1" placeholder="max">
        </div>
        <div class="filter-range">
          <span class="filter-label">BPM</span>
          <input type="number" id="filterMinBpm" class="filter-num" min="0" placeholder="min">
          <span class="filter-dash">–</span>
          <input type="number" id="filterMaxBpm" class="filter-num" min="0" placeholder="max">
        </div>
        <button class="filter-apply" id="filterApply">Search</button>
      </div>
      <div class="list-toolbar">
        <div class="eyebrow" style="margin-top:0;">osu!taiko only — mode is locked, this is a taiko game</div>
        <div style="display:flex; align-items:center; gap:14px;">
          <div id="statusBanner" class="eyebrow" style="margin-top:0;"></div>
          <div class="count" id="songCount"></div>
        </div>
      </div>
      <div class="songlist" id="songList"></div>
      <div id="loadMoreWrap" style="display:none; padding:10px 2px 0;">
        <button class="btn" id="loadMoreBtn" style="width:100%; justify-content:center;">Load more charts</button>
      </div>
    </div>
  </div>

  <div class="bottombar">
    <div class="left-btns">
      <div class="btn">◀ Back</div>
      <div class="btn random">🎲 Random</div>
    </div>
    <div class="btn-play" id="playBtn">PLAY ▶</div>
  </div>
</div>

<iframe id="gameFrame" src="about:blank" title="Taiko gameplay"
  style="display:none; position:fixed; inset:0; width:100%; height:100%; border:0; z-index:50; background:#05070b;"></iframe>

<script>
const DIFF_COLORS = {
  Kantan:     {name:'Easy'},
  Futsuu:     {name:'Normal'},
  Muzukashii: {name:'Hard'},
  Oni:        {name:'Oni'},
  Ura:        {name:'Ura Oni'}
};

// osu!'s own star-rating colour spectrum (the gradient osu!web uses on beatmap
// listings), linearly interpolated between stops — gives every difficulty its
// own precise shade instead of bucketing into 5 flat colours.
const DIFF_SPECTRUM = [
  { stars: 0.1, rgb: [0x42,0x90,0xfb] },
  { stars: 1.25, rgb: [0x4f,0xc0,0xff] },
  { stars: 2.0, rgb: [0x4f,0xff,0xd5] },
  { stars: 2.5, rgb: [0x7c,0xff,0x4f] },
  { stars: 3.3, rgb: [0xf6,0xf0,0x5c] },
  { stars: 4.2, rgb: [0xff,0x80,0x68] },
  { stars: 4.9, rgb: [0xff,0x4e,0x6f] },
  { stars: 5.8, rgb: [0xc6,0x45,0xb8] },
  { stars: 6.7, rgb: [0x65,0x63,0xde] },
  { stars: 7.7, rgb: [0x18,0x15,0x8e] },
  { stars: 9.0, rgb: [0x00,0x00,0x00] },
];
function starColor(stars){
  const s = Math.max(0, stars || 0);
  if (s <= DIFF_SPECTRUM[0].stars) return `rgb(${DIFF_SPECTRUM[0].rgb.join(',')})`;
  for (let i = 1; i < DIFF_SPECTRUM.length; i++){
    if (s <= DIFF_SPECTRUM[i].stars || i === DIFF_SPECTRUM.length - 1){
      const lo = DIFF_SPECTRUM[i-1], hi = DIFF_SPECTRUM[i];
      const t = Math.min(1, (s - lo.stars) / (hi.stars - lo.stars));
      const rgb = lo.rgb.map((c, k) => Math.round(c + (hi.rgb[k] - c) * t));
      return `rgb(${rgb.join(',')})`;
    }
  }
}

// Fallback data — used only if the live API call fails (network/CORS/etc).
const MOCK_SONGS = [
  { title:"Senbonzakura", artist:"Kurousa-P feat. Hatsune Miku", mapper:"Sarawatlism", bpm:154, length:"3:57",
    coverA:'#3a2130', coverB:'#1a1030',
    diffs:[ {d:'Kantan',stars:3},{d:'Futsuu',stars:5},{d:'Muzukashii',stars:7},{d:'Oni',stars:9} ] },
  { title:"Freedom Dive", artist:"xi", mapper:"Nathan", bpm:222, length:"2:15",
    coverA:'#123a4a', coverB:'#0a1a2e',
    diffs:[ {d:'Futsuu',stars:4},{d:'Muzukashii',stars:6},{d:'Oni',stars:9},{d:'Ura',stars:10} ] },
  { title:"Through the Fire and Flames", artist:"DragonForce", mapper:"Andrea", bpm:200, length:"7:24",
    coverA:'#4c3a12', coverB:'#2e1a0a',
    diffs:[ {d:'Muzukashii',stars:6},{d:'Oni',stars:9} ] },
  { title:"Bad Apple!!", artist:"Alstroemeria Records", mapper:"Riana", bpm:138, length:"3:39",
    coverA:'#2b2b3a', coverB:'#12121c',
    diffs:[ {d:'Kantan',stars:2},{d:'Futsuu',stars:4},{d:'Muzukashii',stars:6},{d:'Oni',stars:7} ] },
  { title:"Marisa Stole the Precious Thing", artist:"IOSYS", mapper:"Byakugan249", bpm:190, length:"4:02",
    coverA:'#4c1230', coverB:'#2e0a1c',
    diffs:[ {d:'Futsuu',stars:3},{d:'Muzukashii',stars:6},{d:'Oni',stars:8} ] },
  { title:"Odds & Ends", artist:"Kagerou Project", mapper:"Frostmourne", bpm:181, length:"4:19",
    coverA:'#123a3a', coverB:'#0a1c1c',
    diffs:[ {d:'Kantan',stars:3},{d:'Futsuu',stars:5},{d:'Oni',stars:8} ] },
  { title:"Redial", artist:"P4Koo", mapper:"Doormat", bpm:172, length:"1:47",
    coverA:'#3a1a4c', coverB:'#1a0a2e',
    diffs:[ {d:'Muzukashii',stars:5},{d:'Oni',stars:8},{d:'Ura',stars:9} ] },
  { title:"Rolling Girl", artist:"wowaka feat. Hatsune Miku", mapper:"Kroytz", bpm:172, length:"4:07",
    coverA:'#123a4a', coverB:'#2e1030',
    diffs:[ {d:'Kantan',stars:2},{d:'Futsuu',stars:4},{d:'Muzukashii',stars:6},{d:'Oni',stars:8} ] },
];

let SONGS = [];
let selectedIndex = 0;
let selectedDiffIndex = 0;
let songsAreLive = false;

// --- Live data: hinai v1 search API (CheeseGull-compatible) ---
// mode is hardcoded to 1 (taiko) everywhere below and never exposed in the
// filter UI — this is a taiko game, so non-taiko results are never an option.
const PAGE_SIZE = 30;
const FILTERS = {
  query: '',
  sort: 'ranked_desc',
  status: '1',       // '' = all statuses
  minStars: '', maxStars: '',
  minBpm: '', maxBpm: '',
};
let currentOffset = 0;
let hasMore = true;
let isLoadingPage = false;

function buildSearchParams(offset){
  const p = new URLSearchParams();
  p.set('query', FILTERS.query || '');
  p.set('mode', '1'); // taiko — locked, not a filter option
  if (FILTERS.status !== '') p.set('status', FILTERS.status);
  p.set('amount', String(PAGE_SIZE));
  p.set('offset', String(offset));
  if (FILTERS.sort) p.set('sort', FILTERS.sort);
  if (FILTERS.minStars !== '') p.set('min_stars', FILTERS.minStars);
  if (FILTERS.maxStars !== '') p.set('max_stars', FILTERS.maxStars);
  if (FILTERS.minBpm !== '') p.set('min_bpm', FILTERS.minBpm);
  if (FILTERS.maxBpm !== '') p.set('max_bpm', FILTERS.maxBpm);
  return p.toString();
}
function hinaiDirectUrl(offset){ return `https://mirror.hinamizawa.ai/api/v1/hinai/search?${buildSearchParams(offset)}`; }

// Fill this in after `wrangler deploy` — e.g. "https://taiko-mirror-proxy.yourname.workers.dev"
// Leave blank to skip the proxy fallback entirely.
const PROXY_BASE = "https://taikomirrorproxy.kiwi-martan.workers.dev";
function hinaiProxyUrl(offset){ return PROXY_BASE ? `${PROXY_BASE}/beatmaps/search?${buildSearchParams(offset)}` : null; }

// Bucket a taiko star rating into the Kantan/Futsuu/Muzukashii/Oni/Ura ladder.
function bucketDifficultyName(stars){
  if (stars < 2) return 'Kantan';
  if (stars < 3.3) return 'Futsuu';
  if (stars < 4.8) return 'Muzukashii';
  if (stars < 6.5) return 'Oni';
  return 'Ura';
}

function fmtLength(totalSeconds){
  const s = Math.max(0, Math.round(totalSeconds||0));
  const m = Math.floor(s/60), r = s%60;
  return `${m}:${String(r).padStart(2,'0')}`;
}

// Deterministic-but-varied cover gradient per set, since hinai doesn't hand back a palette.
// Kept desaturated/dark so it sits naturally on the charcoal panel.
function coverColorsFor(setId){
  const hue = (setId * 47) % 360;
  return { a:`hsl(${hue}, 38%, 20%)`, b:`hsl(${(hue+40)%360}, 45%, 10%)` };
}

async function fetchFromUrl(url){
  console.log('[fetch] requesting:', url);
  const res = await fetch(url);
  console.log('[fetch] response:', res.status, res.type, url);
  if (!res.ok) throw new Error(`request returned ${res.status}`);
  const data = await res.json();
  if (!Array.isArray(data)) throw new Error('unexpected response shape');
  return data; // an empty array is a valid answer (no/no-more matches), not a failure
}

async function fetchLiveSongs(offset){
  let data, source;
  let directErrMsg = null;
  try{
    data = await fetchFromUrl(hinaiDirectUrl(offset));
    source = 'direct';
  }catch(directErr){
    directErrMsg = directErr.name ? `${directErr.name}: ${directErr.message}` : String(directErr);
    const proxyUrl = hinaiProxyUrl(offset);
    if (!proxyUrl){
      throw new Error(`direct failed (${directErrMsg}), no proxy configured`);
    }
    try{
      data = await fetchFromUrl(proxyUrl);
      source = 'proxy';
    }catch(proxyErr){
      const proxyErrMsg = proxyErr.name ? `${proxyErr.name}: ${proxyErr.message}` : String(proxyErr);
      throw new Error(`direct: ${directErrMsg} — proxy: ${proxyErrMsg}`);
    }
  }

  const songs = data.map(set => {
    const taikoDiffs = (set.ChildrenBeatmaps || [])
      .filter(b => b.Mode === 1)
      .sort((a,b) => a.DifficultyRating - b.DifficultyRating)
      .map(b => ({
        d: bucketDifficultyName(b.DifficultyRating), // star-rating bucket — used only to pick a ladder colour
        name: b.DiffName || bucketDifficultyName(b.DifficultyRating), // the mapper's actual diff name, e.g. "Futsuu" or a custom title
        stars: Math.round(b.DifficultyRating*10)/10,
        beatmapId: b.BeatmapID
      }));

    // No real taiko difficulty in this set — skip it entirely rather than
    // faking a placeholder. mode=1 in the query should already guarantee
    // this doesn't happen, but this is the actual enforcement, not that.
    if (!taikoDiffs.length) return null;

    const topLen = (set.ChildrenBeatmaps || [])[0]?.TotalLength;
    const colors = coverColorsFor(set.SetID);

    return {
      title: set.Title,
      artist: set.Artist,
      mapper: set.Creator,
      bpm: set.BPM || set.Bpm || '—',
      length: fmtLength(topLen),
      coverA: colors.a, coverB: colors.b,
      cover: `https://assets.ppy.sh/beatmaps/${set.SetID}/covers/cover.jpg`,
      setId: set.SetID,
      diffs: taikoDiffs,
    };
  }).filter(Boolean);

  // hinai's own docs warn that some params fail *silently* (a 200 with
  // unfiltered data, not an error) — so verify sort=difficulty_desc/asc
  // actually did something rather than trusting it blindly, and fix it
  // client-side for this page if the server ignored it.
  if ((FILTERS.sort === 'difficulty_desc' || FILTERS.sort === 'difficulty_asc') && songs.length > 1){
    const wantDesc = FILTERS.sort === 'difficulty_desc';
    const topStars = s => s.diffs[s.diffs.length - 1].stars; // diffs are pre-sorted ascending, so the last one is the hardest
    let isSorted = true;
    for (let i = 1; i < songs.length; i++){
      const prev = topStars(songs[i-1]), cur = topStars(songs[i]);
      if (wantDesc ? cur > prev : cur < prev){ isSorted = false; break; }
    }
    if (!isSorted){
      console.warn(`[hinai] sort=${FILTERS.sort} came back unsorted (star ratings: ${songs.map(topStars).join(', ')}) — the API likely doesn't support difficulty sort on this endpoint. Sorting client-side for this page instead.`);
      songs.sort((a,b) => wantDesc ? topStars(b)-topStars(a) : topStars(a)-topStars(b));
    }
  }

  songs.__source = source;
  songs.__rawCount = data.length; // for hasMore — raw page size from the API, not post-filter count
  return songs;
}

function setStatusBanner(mode, detail){
  const el = document.getElementById('statusBanner');
  if (!el) return;
  el.style.background = '';
  el.style.borderColor = '';
  if (mode === 'direct'){
    el.textContent = 'LIVE — hinai (direct)';
    el.style.color = 'var(--kat)';
  } else if (mode === 'proxy'){
    el.textContent = 'LIVE — hinai (via proxy)';
    el.style.color = 'var(--futsuu)';
  } else {
    el.textContent = `OFFLINE — sample data`;
    el.style.color = 'var(--don)';
    el.style.background = 'rgba(217,71,71,0.12)';
    el.style.borderColor = 'rgba(217,71,71,0.35)';
  }
}

async function loadSongs(reset){
  if (isLoadingPage) return;
  isLoadingPage = true;
  const list = document.getElementById('songList');
  const loadMoreBtn = document.getElementById('loadMoreBtn');

  if (reset){
    currentOffset = 0;
    hasMore = true;
    list.innerHTML = '<div style="padding:20px;color:var(--text-dim);font-size:0.75rem;">Fetching charts from hinai…</div>';
  } else if (loadMoreBtn){
    loadMoreBtn.textContent = 'Loading…';
    loadMoreBtn.disabled = true;
  }

  try{
    const page = await fetchLiveSongs(currentOffset);
    songsAreLive = true;
    setStatusBanner(page.__source || 'direct');
    SONGS = reset ? page : SONGS.concat(page);
    currentOffset += (page.__rawCount || page.length);
    hasMore = (page.__rawCount || page.length) >= PAGE_SIZE;
  }catch(err){
    console.error('hinai fetch failed (direct and proxy):', err);
    if (reset){
      SONGS = MOCK_SONGS;
      songsAreLive = false;
      hasMore = false;
      setStatusBanner('offline', err.message);
    } else {
      // A page beyond the first failing doesn't need to nuke the list we
      // already have — just stop offering more and say why.
      hasMore = false;
      alert('Could not load more maps: ' + err.message);
    }
  }

  if (reset){
    selectedIndex = 0;
    selectedDiffIndex = 0;
  }
  isLoadingPage = false;
  updatePlayButtonState();
  renderAll();
}

function applyFilters(){
  FILTERS.query = document.getElementById('filterQuery').value.trim();
  FILTERS.sort = document.getElementById('filterSort').value;
  FILTERS.status = document.getElementById('filterStatus').value;
  FILTERS.minStars = document.getElementById('filterMinStars').value;
  FILTERS.maxStars = document.getElementById('filterMaxStars').value;
  FILTERS.minBpm = document.getElementById('filterMinBpm').value;
  FILTERS.maxBpm = document.getElementById('filterMaxBpm').value;
  loadSongs(true);
}
document.getElementById('filterApply').addEventListener('click', applyFilters);
document.getElementById('filterQuery').addEventListener('keydown', (e) => { if (e.key === 'Enter') applyFilters(); });
document.getElementById('filterSort').addEventListener('change', applyFilters);
document.getElementById('filterStatus').addEventListener('change', applyFilters);
document.getElementById('loadMoreBtn').addEventListener('click', () => loadSongs(false));

function updatePlayButtonState(){
  const btn = document.getElementById('playBtn');
  if (songsAreLive){
    btn.style.opacity = '';
    btn.style.cursor = '';
    btn.title = '';
  } else {
    btn.style.opacity = '0.45';
    btn.style.cursor = 'not-allowed';
    btn.title = 'Playing requires a live connection to hinai — currently showing offline sample data';
  }
}

function starString(n){ return '★'.repeat(n); }

function renderList(){
  const list = document.getElementById('songList');
  list.innerHTML = '';
  if (songsAreLive && SONGS.length === 0){
    list.innerHTML = '<div style="padding:20px;color:var(--text-dim);font-size:0.75rem;">No taiko maps match these filters — try widening the range.</div>';
  }
  SONGS.forEach((song, i) => {
    const row = document.createElement('div');
    row.className = 'song-row' + (i === selectedIndex ? ' selected' : '');
    const topDiff = song.diffs[song.diffs.length-1];
    const color = starColor(topDiff.stars);
    row.style.setProperty('--row-color', color);
    row.innerHTML = `
      <div class="song-cover">${song.cover ? `<img alt="" loading="lazy">` : ''}</div>
      <div class="song-text">
        <div class="song-title">${song.title}</div>
        <div class="song-artist">${song.artist}</div>
      </div>
      <div class="song-stars">${starString(Math.min(topDiff.stars,5))}${topDiff.stars>5?'+':''}</div>
      <div class="song-bpm">${song.bpm} BPM</div>
    `;
    // Cover art loads over the top of the gradient chip rather than replacing
    // it — a failed/slow image (cross-origin, 404, still loading) just leaves
    // the difficulty-tinted gradient showing underneath instead of a blank box.
    const img = row.querySelector('.song-cover img');
    if (img){
      img.addEventListener('load', () => img.classList.add('loaded'));
      img.addEventListener('error', () => img.remove());
      img.src = song.cover;
    }
    row.addEventListener('click', () => { selectedIndex = i; selectedDiffIndex = song.diffs.length-1; renderAll(); });
    list.appendChild(row);
  });
  document.getElementById('songCount').textContent = SONGS.length + ' CHARTS';

  const loadMoreWrap = document.getElementById('loadMoreWrap');
  const loadMoreBtn = document.getElementById('loadMoreBtn');
  if (songsAreLive && hasMore && SONGS.length > 0){
    loadMoreWrap.style.display = '';
    loadMoreBtn.textContent = 'Load more charts';
    loadMoreBtn.disabled = false;
  } else {
    loadMoreWrap.style.display = 'none';
  }
}

function renderInfo(){
  const song = SONGS[selectedIndex];
  document.getElementById('coverTitle').textContent = song.title;
  document.getElementById('coverArtist').textContent = song.artist;
  document.getElementById('metaBpm').textContent = song.bpm;
  document.getElementById('metaLen').textContent = song.length;
  document.getElementById('mapperName').textContent = song.mapper;

  const cover = document.getElementById('cover');
  cover.style.setProperty('--cover-a', song.coverA);
  cover.style.setProperty('--cover-b', song.coverB);
  cover.style.backgroundImage = '';
  cover.style.backgroundSize = 'cover';
  cover.style.backgroundPosition = 'center';
  if (song.cover){
    const probe = new Image();
    probe.onload = () => {
      // only apply if this is still the selected song (avoids race on fast navigation)
      if (SONGS[selectedIndex] === song){
        cover.style.backgroundImage = `linear-gradient(to top, rgba(0,0,0,0.7), rgba(0,0,0,0.15) 60%), url('${song.cover}')`;
      }
    };
    probe.src = song.cover;
  }

  const wash = document.getElementById('wash');
  wash.style.setProperty('--wash-a', song.coverA);
  wash.style.setProperty('--wash-b', song.coverB);

  const diffList = document.getElementById('diffList');
  diffList.innerHTML = '';
  song.diffs.forEach((diff, i) => {
    const info = DIFF_COLORS[diff.d];
    const color = starColor(diff.stars);
    const btn = document.createElement('div');
    btn.className = 'diff-btn' + (i === selectedDiffIndex ? ' active' : '');
    btn.style.setProperty('--diff-color', color);
    btn.innerHTML = `
      <div class="drum-dot" style="--diff-color:${color}"></div>
      <div class="diff-name">${diff.name || info.name}</div>
      <div class="diff-stars">${starString(Math.min(diff.stars,5))}${diff.stars>5?' +'+(diff.stars-5):''}</div>
    `;
    btn.addEventListener('click', () => { selectedDiffIndex = i; renderAll(); });
    diffList.appendChild(btn);
  });

  document.getElementById('metaStars').textContent = song.diffs[selectedDiffIndex].stars;

  cover.style.setProperty('--diff-color', starColor(song.diffs[selectedDiffIndex].stars));

  renderNoteStrip();
}

function renderNoteStrip(){
  const track = document.getElementById('noteTrack');
  track.innerHTML = '';
  const pattern = ['don','don','katsu','don','katsu','katsu','don','big-don','katsu','don','don','katsu'];
  // duplicate pattern so the scroll loop feels continuous
  [...pattern, ...pattern].forEach(type => {
    const note = document.createElement('div');
    const big = type.startsWith('big-');
    const kind = big ? type.replace('big-','') : type;
    note.className = `note ${kind}` + (big ? ' big' : '');
    track.appendChild(note);
  });
}

function renderAll(){
  renderList();
  renderInfo();
}

// ══════════════════════════════════════════════════════════════════════
//  GAMEPLAY HANDOFF — Play downloads the .osz from hinai (direct, falling
//  back to the proxy worker, same pattern as the search fetch above), then
//  hands the raw bytes to gameplay.html via postMessage once it signals
//  it's ready. The iframe is reloaded fresh on every Play so gameplay state
//  never leaks between songs/attempts.
// ══════════════════════════════════════════════════════════════════════
const gameFrame = document.getElementById('gameFrame');
let pendingLoadPayload = null;

window.addEventListener('message', (e) => {
  const data = e.data;
  if (!data) return;
  if (data.type === 'taiko-ready'){
    if (pendingLoadPayload){
      gameFrame.contentWindow.postMessage(pendingLoadPayload, '*');
      pendingLoadPayload = null;
    }
    // Setting src/display alone doesn't move keyboard focus into the iframe —
    // it stays on whatever had it before (the Play button), so the iframe's
    // own keydown listeners never see anything until focus is moved here.
    gameFrame.focus();
  } else if (data.type === 'taiko-quit'){
    gameFrame.style.display = 'none';
    gameFrame.src = 'about:blank';
  } else if (data.type === 'taiko-load-error'){
    alert('Could not start gameplay: ' + data.message);
    gameFrame.style.display = 'none';
    gameFrame.src = 'about:blank';
  }
});

async function downloadOszBytes(setId){
  const directUrl = `https://mirror.hinamizawa.ai/api/v1/hinai/d/${setId}`;
  const proxyUrl = PROXY_BASE ? `${PROXY_BASE}/beatmaps/download/${setId}` : null;
  async function tryUrl(url){
    const res = await fetch(url);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return await res.arrayBuffer();
  }
  try{
    return await tryUrl(directUrl);
  }catch(directErr){
    // The direct browser->hinai request failing here is expected in most
    // setups — that endpoint isn't CORS-enabled for fetch(), which is the
    // whole reason the worker fallback exists. Log it at low volume for
    // context, but don't treat it as the interesting failure on its own.
    console.warn('[download] direct fetch failed (expected without CORS on that endpoint):', directErr.message);
    if (!proxyUrl){
      throw new Error(`No proxy configured, and the direct request failed: ${directErr.message}`);
    }
    try{
      return await tryUrl(proxyUrl);
    }catch(proxyErr){
      console.error('[download] proxy fallback also failed:', proxyErr.message);
      throw new Error(`Proxy download failed: ${proxyErr.message}`);
    }
  }
}

let isDownloading = false;
document.getElementById('playBtn').addEventListener('click', async () => {
  if (!songsAreLive) return; // offline sample data has no real map to download
  if (isDownloading) return; // guards against a stray/duplicate trigger (e.g. Enter) while one is already in flight
  isDownloading = true;
  const song = SONGS[selectedIndex];
  const diff = song.diffs[selectedDiffIndex];
  const playBtn = document.getElementById('playBtn');
  const originalText = playBtn.textContent;
  playBtn.textContent = 'DOWNLOADING…';
  playBtn.style.pointerEvents = 'none';
  try{
    const buffer = await downloadOszBytes(song.setId);
    pendingLoadPayload = { type: 'taiko-load', buffer, diffHint: diff.name || diff.d, filename: (song.title || 'beatmap') + '.osz' };
    gameFrame.style.display = 'block';
    gameFrame.src = 'gameplay.html?t=' + Date.now(); // force a fresh load, triggers taiko-ready
  }catch(err){
    console.error('map download failed:', err);
    alert('Could not download the map: ' + err.message);
  }finally{
    playBtn.textContent = originalText;
    playBtn.style.pointerEvents = '';
    isDownloading = false;
  }
});

window.addEventListener('keydown', (e) => {
  // Don't hijack keys while the person is typing/selecting in the filter bar —
  // this was the cause of Enter in the search box (or arrows in a stars/BPM
  // field) *also* triggering song navigation or an instant Play in the background.
  const tag = e.target && e.target.tagName;
  if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') return;

  if (e.key === 'ArrowDown'){ selectedIndex = (selectedIndex+1) % SONGS.length; selectedDiffIndex = 0; renderAll(); }
  if (e.key === 'ArrowUp'){ selectedIndex = (selectedIndex-1+SONGS.length) % SONGS.length; selectedDiffIndex = 0; renderAll(); }
  if (e.key === 'ArrowRight'){ const song = SONGS[selectedIndex]; selectedDiffIndex = Math.min(selectedDiffIndex+1, song.diffs.length-1); renderAll(); }
  if (e.key === 'ArrowLeft'){ selectedDiffIndex = Math.max(selectedDiffIndex-1, 0); renderAll(); }
  if (e.key === 'Enter'){ document.getElementById('playBtn').click(); }
});

// Ambient drifting notes in the background grid, echoing the editor's title screen.
(function spawnDriftNotes(){
  const fx = document.getElementById('grain');
  if (!fx) return;
  const colors = ['var(--don)', 'var(--kat)', 'var(--accent)'];
  const COUNT = 9;
  for (let i = 0; i < COUNT; i++){
    const dot = document.createElement('div');
    dot.className = 'drift-note';
    const size = 20 + Math.round(Math.random() * 26);
    const top = Math.round(Math.random() * 92);
    const duration = 16 + Math.random() * 16;
    const delay = -Math.random() * duration;
    dot.style.width = size + 'px';
    dot.style.height = size + 'px';
    dot.style.top = top + '%';
    dot.style.background = colors[i % colors.length];
    dot.style.border = '3px solid rgba(255,255,255,0.12)';
    dot.style.animationDuration = duration.toFixed(1) + 's';
    dot.style.animationDelay = delay.toFixed(1) + 's';
    dot.style.opacity = (0.10 + Math.random() * 0.14).toFixed(2);
    fx.appendChild(dot);
  }
})();

updatePlayButtonState();
loadSongs(true);
