<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Taiko Song Select</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap');

:root{
  --bg-deep:#0a0912;
  --bg-panel:#15131f;
  --bg-panel-2:#1c1a2a;
  --don:#e0273f;
  --don-dim:#7a1522;
  --katsu:#2f8fd6;
  --katsu-dim:#164a6b;
  --gold:#f2b134;
  --text:#f4efe6;
  --text-dim:#948fa3;
  --line:#2a2738;
}

*{box-sizing:border-box; margin:0; padding:0;}

body{
  background:var(--bg-deep);
  color:var(--text);
  font-family:'Zen Kaku Gothic New', sans-serif;
  height:100vh;
  overflow:hidden;
  position:relative;
}

/* ambient background wash tied to selected track */
#wash{
  position:absolute; inset:0;
  background: radial-gradient(circle at 75% 30%, var(--wash-a, #3a1420) 0%, transparent 55%),
              radial-gradient(circle at 20% 80%, var(--wash-b, #0f2a3d) 0%, transparent 50%);
  transition: background 0.6s ease;
  z-index:0;
  opacity:0.8;
}
#grain{
  position:absolute; inset:0; z-index:1; pointer-events:none;
  background-image: repeating-linear-gradient(0deg, rgba(255,255,255,0.015) 0px, transparent 1px, transparent 2px);
}

.screen{ position:relative; z-index:2; height:100%; display:flex; flex-direction:column; }

/* ---------- top bar ---------- */
.topbar{
  display:flex; align-items:center; justify-content:space-between;
  padding:22px 40px 10px;
}
.logo{
  font-family:'Bebas Neue', sans-serif;
  font-size:34px; letter-spacing:2px;
  display:flex; align-items:baseline; gap:10px;
}
.logo .don{color:var(--don);}
.logo .katsu{color:var(--katsu);}
.logo small{
  font-family:'Zen Kaku Gothic New', sans-serif;
  font-size:12px; color:var(--text-dim); letter-spacing:3px; font-weight:500;
}
.searchhint{
  color:var(--text-dim); font-size:12px; letter-spacing:1px;
}
.searchhint kbd{
  background:var(--bg-panel-2); border:1px solid var(--line); border-radius:4px;
  padding:2px 6px; font-size:11px; color:var(--text);
}

/* ---------- main body ---------- */
.main{ flex:1; display:flex; min-height:0; padding:10px 40px 20px; gap:28px;}

/* left info panel */
.infopanel{
  width:340px; flex-shrink:0; display:flex; flex-direction:column; gap:18px;
}
.cover{
  height:190px; border-radius:10px;
  background: linear-gradient(135deg, var(--cover-a,#5a2130), var(--cover-b,#1c3b52));
  position:relative; overflow:hidden;
  border:1px solid var(--line);
  display:flex; align-items:flex-end;
}
.cover::after{
  content:""; position:absolute; inset:0;
  background: linear-gradient(to top, rgba(0,0,0,0.65), transparent 60%);
}
.cover-title{
  position:relative; z-index:1; padding:16px;
  font-weight:900; font-size:19px; line-height:1.25;
}
.cover-artist{
  position:relative; z-index:1; padding:0 16px 14px; margin-top:-10px;
  color:var(--text-dim); font-size:12.5px; font-weight:500;
}

.meta-row{ display:flex; gap:10px; }
.meta-chip{
  background:var(--bg-panel); border:1px solid var(--line); border-radius:8px;
  padding:8px 12px; flex:1; text-align:center;
}
.meta-chip .val{ font-family:'Bebas Neue'; font-size:20px; letter-spacing:1px; }
.meta-chip .lbl{ font-size:10px; color:var(--text-dim); letter-spacing:1.5px; margin-top:2px;}

.mapper{ font-size:12px; color:var(--text-dim); }
.mapper b{ color:var(--text); font-weight:700; }

/* difficulty drum selector — signature element */
.difficulties{ display:flex; flex-direction:column; gap:8px; margin-top:4px; }
.diff-label{ font-size:10px; letter-spacing:2px; color:var(--text-dim); margin-bottom:2px;}
.diff-btn{
  display:flex; align-items:center; gap:12px;
  background:var(--bg-panel); border:1px solid var(--line); border-radius:999px;
  padding:7px 16px 7px 7px; cursor:pointer; transition:all .15s ease;
}
.diff-btn:hover{ border-color:var(--diff-color); transform:translateX(3px); }
.diff-btn.active{
  background:var(--bg-panel-2); border-color:var(--diff-color);
  box-shadow:0 0 0 1px var(--diff-color), 0 0 16px -4px var(--diff-color);
}
.drum-dot{
  width:30px; height:30px; border-radius:50%; flex-shrink:0;
  background:radial-gradient(circle at 35% 30%, var(--diff-color-light,#fff2), transparent 60%), var(--diff-color);
  border:3px solid rgba(255,255,255,0.15);
}
.diff-name{ font-weight:700; font-size:13px; flex:1; }
.diff-stars{ font-size:11px; color:var(--gold); letter-spacing:1px; }

/* note preview strip — mimics the gameplay highway */
.notestrip{
  margin-top:auto;
  height:56px; border-radius:8px;
  background:var(--bg-panel);
  border:1px solid var(--line);
  position:relative; overflow:hidden;
}
.notestrip .rail{
  position:absolute; left:52px; top:0; bottom:0; width:2px; background:var(--gold); opacity:.5;
}
.notestrip .judge-ring{
  position:absolute; left:30px; top:50%; transform:translateY(-50%);
  width:44px; height:44px; border-radius:50%;
  border:3px solid var(--text-dim); opacity:.6;
}
.notestrip .track{
  position:absolute; top:0; left:60px; right:0; bottom:0;
  display:flex; align-items:center;
  animation: scroll-notes 4s linear infinite;
}
.note{
  width:36px; height:36px; border-radius:50%; flex-shrink:0; margin-right:26px;
  border:3px solid rgba(255,255,255,0.2);
}
.note.don{ background:var(--don); }
.note.katsu{ background:var(--katsu); }
.note.big{ width:46px; height:46px; }
@keyframes scroll-notes{
  from{ transform:translateX(0); }
  to{ transform:translateX(-620px); }
}

/* ---------- song list (right) ---------- */
.songlist-wrap{
  flex:1; min-width:0; display:flex; flex-direction:column;
}
.list-toolbar{
  display:flex; justify-content:space-between; align-items:center;
  margin-bottom:10px; padding:0 4px;
}
.sort-tabs{ display:flex; gap:6px; }
.sort-tab{
  font-size:11px; letter-spacing:1px; color:var(--text-dim);
  padding:5px 12px; border-radius:6px; cursor:pointer; border:1px solid transparent;
}
.sort-tab.active{ color:var(--text); background:var(--bg-panel); border-color:var(--line); }
.count{ font-size:11px; color:var(--text-dim); }

.songlist{
  flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:6px;
  padding-right:6px;
}
.songlist::-webkit-scrollbar{ width:6px; }
.songlist::-webkit-scrollbar-thumb{ background:var(--line); border-radius:3px; }

.song-row{
  display:flex; align-items:center; gap:14px;
  background:var(--bg-panel); border:1px solid transparent; border-radius:8px;
  padding:10px 16px; cursor:pointer; transition:all .12s ease;
}
.song-row:hover{ background:var(--bg-panel-2); transform:translateX(-4px); }
.song-row.selected{
  background:var(--bg-panel-2);
  border-color:var(--row-color);
  transform:translateX(-10px);
  box-shadow:-4px 0 0 var(--row-color);
}
.song-icon{
  width:38px; height:38px; border-radius:50%; flex-shrink:0;
  background:linear-gradient(135deg, var(--row-color), var(--bg-deep));
  border:2px solid rgba(255,255,255,0.15);
}
.song-text{ flex:1; min-width:0; }
.song-title{ font-weight:700; font-size:14.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.song-artist{ font-size:11.5px; color:var(--text-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.song-stars{ font-size:11px; color:var(--gold); flex-shrink:0; letter-spacing:1px; }
.song-bpm{ font-size:11px; color:var(--text-dim); width:64px; text-align:right; flex-shrink:0; }

/* ---------- bottom bar ---------- */
.bottombar{
  display:flex; justify-content:space-between; align-items:center;
  padding:14px 40px 22px;
}
.btn{
  font-family:'Zen Kaku Gothic New'; font-weight:700; font-size:12.5px; letter-spacing:1px;
  background:var(--bg-panel); border:1px solid var(--line); color:var(--text);
  padding:11px 20px; border-radius:8px; cursor:pointer;
}
.btn:hover{ background:var(--bg-panel-2); }
.btn.random:hover{ border-color:var(--katsu); }
.btn-play{
  font-family:'Bebas Neue'; font-size:22px; letter-spacing:2px;
  background:linear-gradient(135deg, var(--don), #a01528);
  border:none; color:#fff; padding:12px 46px; border-radius:999px; cursor:pointer;
  box-shadow:0 4px 20px -4px var(--don);
}
.btn-play:hover{ filter:brightness(1.1); }
.left-btns{ display:flex; gap:10px; }
</style>
</head>
<body>
<div id="wash"></div>
<div id="grain"></div>

<div class="screen">
  <div class="topbar">
    <div class="logo"><span class="don">タ</span><span class="katsu">イコ</span>&nbsp;SELECT<small>osu!taiko — song select</small></div>
    <div class="searchhint">Navigate <kbd>↑</kbd><kbd>↓</kbd>&nbsp; Difficulty <kbd>←</kbd><kbd>→</kbd>&nbsp; Play <kbd>Enter</kbd> &nbsp; <span id="debugToggle" style="cursor:pointer; text-decoration:underline;">🐞 debug console</span> &nbsp; <span id="retryFetch" style="cursor:pointer; text-decoration:underline;">🔄 retry fetch</span></div>
  </div>

  <div class="main">
    <div class="infopanel">
      <div class="cover" id="cover">
        <div class="cover-title" id="coverTitle"></div>
      </div>
      <div class="cover-artist" id="coverArtist"></div>

      <div class="meta-row">
        <div class="meta-chip"><div class="val" id="metaBpm"></div><div class="lbl">BPM</div></div>
        <div class="meta-chip"><div class="val" id="metaLen"></div><div class="lbl">LENGTH</div></div>
        <div class="meta-chip"><div class="val" id="metaStars"></div><div class="lbl">STARS</div></div>
      </div>

      <div class="mapper">Mapped by <b id="mapperName"></b></div>

      <div class="difficulties" id="diffList">
        <div class="diff-label">DIFFICULTY</div>
      </div>

      <div class="notestrip">
        <div class="judge-ring"></div>
        <div class="rail"></div>
        <div class="track" id="noteTrack"></div>
      </div>
    </div>

    <div class="songlist-wrap">
      <div class="list-toolbar">
        <div class="sort-tabs">
          <div class="sort-tab active">TITLE</div>
          <div class="sort-tab">ARTIST</div>
          <div class="sort-tab">STARS</div>
          <div class="sort-tab">BPM</div>
        </div>
        <div style="display:flex; align-items:center; gap:14px;">
          <div id="statusBanner" style="font-size:10.5px; letter-spacing:1.5px; font-weight:700;"></div>
          <div class="count" id="songCount"></div>
        </div>
      </div>
      <div class="songlist" id="songList"></div>
    </div>
  </div>

  <div class="bottombar">
    <div class="left-btns">
      <div class="btn">◀ BACK</div>
      <div class="btn random">🎲 RANDOM</div>
    </div>
    <div class="btn-play" id="playBtn">PLAY ▶</div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/eruda/3.0.1/eruda.min.js"></script>
<script>
// Init immediately (hidden) so it's recording from page load, not just from when opened.
if (window.eruda){ eruda.init(); eruda.hide(); }
document.getElementById('debugToggle').addEventListener('click', () => { if (window.eruda) eruda.show(); });
document.getElementById('retryFetch').addEventListener('click', () => { if (window.eruda) eruda.show(); loadSongs(); });
</script>
<script>
const DIFF_COLORS = {
  Kantan:  {c:'#4fbf5f', name:'Easy'},
  Futsuu:  {c:'#f2c14e', name:'Normal'},
  Muzukashii: {c:'#f28c28', name:'Hard'},
  Oni:     {c:'#e0273f', name:'Oni'},
  Ura:     {c:'#9b4fe0', name:'Ura Oni'}
};

// Fallback data — used only if the live API call fails (network/CORS/etc).
const MOCK_SONGS = [
  { title:"Senbonzakura", artist:"Kurousa-P feat. Hatsune Miku", mapper:"Sarawatlism", bpm:154, length:"3:57",
    coverA:'#5a2130', coverB:'#1c1030',
    diffs:[ {d:'Kantan',stars:3},{d:'Futsuu',stars:5},{d:'Muzukashii',stars:7},{d:'Oni',stars:9} ] },
  { title:"Freedom Dive", artist:"xi", mapper:"Nathan", bpm:222, length:"2:15",
    coverA:'#123a5c', coverB:'#0a1a2e',
    diffs:[ {d:'Futsuu',stars:4},{d:'Muzukashii',stars:6},{d:'Oni',stars:9},{d:'Ura',stars:10} ] },
  { title:"Through the Fire and Flames", artist:"DragonForce", mapper:"Andrea", bpm:200, length:"7:24",
    coverA:'#5c3a12', coverB:'#2e1a0a',
    diffs:[ {d:'Muzukashii',stars:6},{d:'Oni',stars:9} ] },
  { title:"Bad Apple!!", artist:"Alstroemeria Records", mapper:"Riana", bpm:138, length:"3:39",
    coverA:'#2b2b3a', coverB:'#12121c',
    diffs:[ {d:'Kantan',stars:2},{d:'Futsuu',stars:4},{d:'Muzukashii',stars:6},{d:'Oni',stars:7} ] },
  { title:"Marisa Stole the Precious Thing", artist:"IOSYS", mapper:"Byakugan249", bpm:190, length:"4:02",
    coverA:'#5c1230', coverB:'#2e0a1c',
    diffs:[ {d:'Futsuu',stars:3},{d:'Muzukashii',stars:6},{d:'Oni',stars:8} ] },
  { title:"Odds & Ends", artist:"Kagerou Project", mapper:"Frostmourne", bpm:181, length:"4:19",
    coverA:'#123a3a', coverB:'#0a1c1c',
    diffs:[ {d:'Kantan',stars:3},{d:'Futsuu',stars:5},{d:'Oni',stars:8} ] },
  { title:"Redial", artist:"P4Koo", mapper:"Doormat", bpm:172, length:"1:47",
    coverA:'#3a1a5c', coverB:'#1a0a2e',
    diffs:[ {d:'Muzukashii',stars:5},{d:'Oni',stars:8},{d:'Ura',stars:9} ] },
  { title:"Rolling Girl", artist:"wowaka feat. Hatsune Miku", mapper:"Kroytz", bpm:172, length:"4:07",
    coverA:'#123a5c', coverB:'#2e1030',
    diffs:[ {d:'Kantan',stars:2},{d:'Futsuu',stars:4},{d:'Muzukashii',stars:6},{d:'Oni',stars:8} ] },
];

let SONGS = [];
let selectedIndex = 0;
let selectedDiffIndex = 0;

// --- Live data: hinai v1 search API (CheeseGull-compatible), taiko mode, ranked only ---
const HINAI_QUERY = "query=&mode=1&status=1&amount=30&sort=plays_desc";
const HINAI_DIRECT_URL = `https://mirror.hinamizawa.ai/api/v1/hinai/search?${HINAI_QUERY}`;

// Fill this in after `wrangler deploy` — e.g. "https://taiko-mirror-proxy.yourname.workers.dev"
// Leave blank to skip the proxy fallback entirely.
const PROXY_BASE = "https://taikomirrorproxy.kiwi-martan.workers.dev";
const HINAI_PROXY_URL = PROXY_BASE ? `${PROXY_BASE}/beatmaps/search?${HINAI_QUERY}` : null;

// Bucket a taiko star rating into the Kantan/Futsuu/Muzukashii/Oni/Ura ladder.
function bucketDifficultyName(stars){
  if (stars < 2) return 'Kantan';
  if (stars < 3.3) return 'Futsuu';
  if (stars < 4.8) return 'Muzukashii';
  if (stars < 6.5) return 'Oni';
  return 'Ura';
}

function fmtLength(totalSeconds){
  const s = Math.max(0, Math.round(totalSeconds||0));
  const m = Math.floor(s/60), r = s%60;
  return `${m}:${String(r).padStart(2,'0')}`;
}

// Deterministic-but-varied cover gradient per set, since hinai doesn't hand back a palette.
function coverColorsFor(setId){
  const hue = (setId * 47) % 360;
  return { a:`hsl(${hue}, 55%, 24%)`, b:`hsl(${(hue+40)%360}, 60%, 12%)` };
}

async function fetchFromUrl(url){
  console.log('[fetch] requesting:', url);
  const res = await fetch(url);
  console.log('[fetch] response:', res.status, res.type, url);
  if (!res.ok) throw new Error(`request returned ${res.status}`);
  const data = await res.json();
  if (!Array.isArray(data) || data.length === 0) throw new Error('empty response');
  return data;
}

async function fetchLiveSongs(){
  let data, source;
  let directErrMsg = null;
  try{
    data = await fetchFromUrl(HINAI_DIRECT_URL);
    source = 'direct';
  }catch(directErr){
    directErrMsg = directErr.name ? `${directErr.name}: ${directErr.message}` : String(directErr);
    if (!HINAI_PROXY_URL){
      throw new Error(`direct failed (${directErrMsg}), no proxy configured`);
    }
    try{
      data = await fetchFromUrl(HINAI_PROXY_URL);
      source = 'proxy';
    }catch(proxyErr){
      const proxyErrMsg = proxyErr.name ? `${proxyErr.name}: ${proxyErr.message}` : String(proxyErr);
      throw new Error(`direct: ${directErrMsg} — proxy: ${proxyErrMsg}`);
    }
  }

  const songs = data.map(set => {
    const taikoDiffs = (set.ChildrenBeatmaps || [])
      .filter(b => b.Mode === 1)
      .sort((a,b) => a.DifficultyRating - b.DifficultyRating)
      .map(b => ({ d: bucketDifficultyName(b.DifficultyRating), stars: Math.round(b.DifficultyRating*10)/10, beatmapId: b.BeatmapID }));

    const topLen = (set.ChildrenBeatmaps || [])[0]?.TotalLength;
    const colors = coverColorsFor(set.SetID);

    return {
      title: set.Title,
      artist: set.Artist,
      mapper: set.Creator,
      bpm: set.BPM || set.Bpm || '—',
      length: fmtLength(topLen),
      coverA: colors.a, coverB: colors.b,
      cover: `https://assets.ppy.sh/beatmaps/${set.SetID}/covers/cover.jpg`,
      diffs: taikoDiffs.length ? taikoDiffs : [{ d:'Oni', stars:0, beatmapId:null }],
    };
  }).filter(s => s.diffs.length > 0);

  songs.__source = source;
  return songs;
}

function setStatusBanner(mode, detail){
  const el = document.getElementById('statusBanner');
  if (!el) return;
  if (mode === 'direct'){
    el.textContent = 'LIVE — hinai (direct)';
    el.style.color = 'var(--katsu)';
  } else if (mode === 'proxy'){
    el.textContent = 'LIVE — hinai (via proxy)';
    el.style.color = 'var(--gold)';
  } else {
    el.textContent = `OFFLINE — sample data (${detail})`;
    el.style.color = 'var(--don)';
  }
}

async function loadSongs(){
  const list = document.getElementById('songList');
  list.innerHTML = '<div style="padding:20px;color:var(--text-dim);font-size:12px;">Fetching charts from hinai…</div>';
  try{
    SONGS = await fetchLiveSongs();
    setStatusBanner(SONGS.__source || 'direct');
  }catch(err){
    console.error('hinai fetch failed (direct and proxy), falling back to mock data:', err);
    SONGS = MOCK_SONGS;
    setStatusBanner('offline', err.message);
  }
  selectedIndex = 0;
  selectedDiffIndex = 0;
  renderAll();
}

function starString(n){ return '★'.repeat(n); }

function renderList(){
  const list = document.getElementById('songList');
  list.innerHTML = '';
  SONGS.forEach((song, i) => {
    const row = document.createElement('div');
    row.className = 'song-row' + (i === selectedIndex ? ' selected' : '');
    const topDiff = song.diffs[song.diffs.length-1];
    const color = DIFF_COLORS[topDiff.d].c;
    row.style.setProperty('--row-color', color);
    row.innerHTML = `
      <div class="song-icon" style="background:linear-gradient(135deg, ${color}, #0a0912)"></div>
      <div class="song-text">
        <div class="song-title">${song.title}</div>
        <div class="song-artist">${song.artist}</div>
      </div>
      <div class="song-stars">${starString(Math.min(topDiff.stars,5))}${topDiff.stars>5?'+':''}</div>
      <div class="song-bpm">${song.bpm} BPM</div>
    `;
    row.addEventListener('click', () => { selectedIndex = i; selectedDiffIndex = song.diffs.length-1; renderAll(); });
    list.appendChild(row);
  });
  document.getElementById('songCount').textContent = SONGS.length + ' CHARTS';
}

function renderInfo(){
  const song = SONGS[selectedIndex];
  document.getElementById('coverTitle').textContent = song.title;
  document.getElementById('coverArtist').textContent = song.artist;
  document.getElementById('metaBpm').textContent = song.bpm;
  document.getElementById('metaLen').textContent = song.length;
  document.getElementById('mapperName').textContent = song.mapper;

  const cover = document.getElementById('cover');
  cover.style.setProperty('--cover-a', song.coverA);
  cover.style.setProperty('--cover-b', song.coverB);
  cover.style.backgroundImage = '';
  cover.style.backgroundSize = 'cover';
  cover.style.backgroundPosition = 'center';
  if (song.cover){
    const probe = new Image();
    probe.onload = () => {
      // only apply if this is still the selected song (avoids race on fast navigation)
      if (SONGS[selectedIndex] === song){
        cover.style.backgroundImage = `linear-gradient(to top, rgba(0,0,0,0.65), rgba(0,0,0,0.1) 60%), url('${song.cover}')`;
      }
    };
    probe.src = song.cover;
  }

  const wash = document.getElementById('wash');
  wash.style.setProperty('--wash-a', song.coverA);
  wash.style.setProperty('--wash-b', song.coverB);

  const diffList = document.getElementById('diffList');
  diffList.innerHTML = '<div class="diff-label">DIFFICULTY</div>';
  song.diffs.forEach((diff, i) => {
    const info = DIFF_COLORS[diff.d];
    const btn = document.createElement('div');
    btn.className = 'diff-btn' + (i === selectedDiffIndex ? ' active' : '');
    btn.style.setProperty('--diff-color', info.c);
    btn.innerHTML = `
      <div class="drum-dot" style="--diff-color:${info.c}"></div>
      <div class="diff-name">${info.name}</div>
      <div class="diff-stars">${starString(Math.min(diff.stars,5))}${diff.stars>5?' +'+(diff.stars-5):''}</div>
    `;
    btn.addEventListener('click', () => { selectedDiffIndex = i; renderAll(); });
    diffList.appendChild(btn);
  });

  document.getElementById('metaStars').textContent = song.diffs[selectedDiffIndex].stars;

  renderNoteStrip();
}

function renderNoteStrip(){
  const track = document.getElementById('noteTrack');
  track.innerHTML = '';
  const pattern = ['don','don','katsu','don','katsu','katsu','don','big-don','katsu','don','don','katsu'];
  // duplicate pattern so the scroll loop feels continuous
  [...pattern, ...pattern].forEach(type => {
    const note = document.createElement('div');
    const big = type.startsWith('big-');
    const kind = big ? type.replace('big-','') : type;
    note.className = `note ${kind}` + (big ? ' big' : '');
    track.appendChild(note);
  });
}

function renderAll(){
  renderList();
  renderInfo();
}

document.getElementById('playBtn').addEventListener('click', () => {
  const song = SONGS[selectedIndex];
  const diff = song.diffs[selectedDiffIndex];
  alert(`Starting: ${song.title} — ${DIFF_COLORS[diff.d].name} (${diff.stars}★)\n\nThis is where gameplay will hook in.`);
});

window.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowDown'){ selectedIndex = (selectedIndex+1) % SONGS.length; selectedDiffIndex = 0; renderAll(); }
  if (e.key === 'ArrowUp'){ selectedIndex = (selectedIndex-1+SONGS.length) % SONGS.length; selectedDiffIndex = 0; renderAll(); }
  if (e.key === 'ArrowRight'){ const song = SONGS[selectedIndex]; selectedDiffIndex = Math.min(selectedDiffIndex+1, song.diffs.length-1); renderAll(); }
  if (e.key === 'ArrowLeft'){ selectedDiffIndex = Math.max(selectedDiffIndex-1, 0); renderAll(); }
  if (e.key === 'Enter'){ document.getElementById('playBtn').click(); }
});

loadSongs();
</script>
</body>
</html>
